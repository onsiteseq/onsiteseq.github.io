<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="body_g" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <radialGradient id="body_h" cx="38%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spike_g" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </radialGradient>
  </defs>

  <!-- === Spike proteins (corona) === -->
  <!-- Each spike: ellipse on tip of a thin stalk -->
  <!-- Top -->
  <line x1="50" y1="32" x2="50" y2="18" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="50" cy="13" rx="5" ry="7" fill="url(#spike_g)"/>
  <!-- Top-right -->
  <line x1="61" y1="36" x2="71" y2="23" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="75" cy="19" rx="5" ry="7" transform="rotate(38 75 19)" fill="url(#spike_g)"/>
  <!-- Right -->
  <line x1="68" y1="50" x2="83" y2="50" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="90" cy="50" rx="7" ry="5" fill="url(#spike_g)"/>
  <!-- Bottom-right -->
  <line x1="61" y1="64" x2="71" y2="77" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="75" cy="81" rx="5" ry="7" transform="rotate(-38 75 81)" fill="url(#spike_g)"/>
  <!-- Bottom -->
  <line x1="50" y1="68" x2="50" y2="82" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="50" cy="87" rx="5" ry="7" fill="url(#spike_g)"/>
  <!-- Bottom-left -->
  <line x1="39" y1="64" x2="29" y2="77" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="25" cy="81" rx="5" ry="7" transform="rotate(38 25 81)" fill="url(#spike_g)"/>
  <!-- Left -->
  <line x1="32" y1="50" x2="17" y2="50" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="10" cy="50" rx="7" ry="5" fill="url(#spike_g)"/>
  <!-- Top-left -->
  <line x1="39" y1="36" x2="29" y2="23" stroke="#bf360c" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="25" cy="19" rx="5" ry="7" transform="rotate(-38 25 19)" fill="url(#spike_g)"/>

  <!-- === Viral body === -->
  <circle cx="50" cy="50" r="19" fill="url(#body_g)"/>
  <circle cx="50" cy="50" r="19" fill="url(#body_h)"/>
  <circle cx="50" cy="50" r="19" fill="none" stroke="#bf360c" stroke-width="1.5" opacity="0.6"/>

  <!-- === RNA inside === -->
  <path d="M42 46 Q50 42 58 46 Q50 50 42 54 Q50 58 58 54"
        fill="none" stroke="#7f1f00" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- === E (envelope) protein dots on surface === -->
  <circle cx="50" cy="32" r="2.2" fill="#bf360c" opacity="0.7"/>
  <circle cx="67" cy="40" r="2.2" fill="#bf360c" opacity="0.7"/>
  <circle cx="67" cy="60" r="2.2" fill="#bf360c" opacity="0.7"/>
  <circle cx="50" cy="68" r="2.2" fill="#bf360c" opacity="0.7"/>
  <circle cx="33" cy="60" r="2.2" fill="#bf360c" opacity="0.7"/>
  <circle cx="33" cy="40" r="2.2" fill="#bf360c" opacity="0.7"/>
</svg>
