<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="hsv_env" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="hsv_capsid" cx="40%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="hsv_neuron" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="hsv_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === Neuron (encephalitis tropism) === -->
  <g stroke="#b45309" stroke-width="1.4" stroke-linecap="round" fill="none">
    <!-- axon towards the virion -->
    <path d="M70.5 68.5 C66 64 62 61 58 57.5"/>
    <!-- dendrites -->
    <path d="M82 68 L88 62"/>
    <path d="M84 74 L92 73"/>
    <path d="M82 80 L87 86"/>
    <path d="M76 81.5 L76 89"/>
    <path d="M70 79 L65 85"/>
  </g>
  <!-- synaptic bouton and neurotransmitter dots -->
  <circle cx="57" cy="56.5" r="2.6" fill="url(#hsv_neuron)" stroke="#b45309" stroke-width="1.1"/>
  <g fill="#f59e0b">
    <circle cx="53.5" cy="53.5" r="1.1"/>
    <circle cx="51" cy="55.5" r="0.9"/>
    <circle cx="52.8" cy="51" r="0.9"/>
  </g>
  <!-- soma -->
  <circle cx="76" cy="74" r="7.5" fill="url(#hsv_neuron)" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="76" cy="74" r="3" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
  <circle cx="73.8" cy="71.6" r="1.2" fill="#fffbeb" fill-opacity="0.85"/>

  <!-- === Herpesvirion: envelope with glycoprotein spikes === -->
  <g stroke="#047857" stroke-width="1.5" stroke-linecap="round">
    <line x1="64" y1="42" x2="71" y2="42"/>
    <line x1="42" y1="64" x2="42" y2="71"/>
    <line x1="31" y1="61.05" x2="27.5" y2="67.11"/>
    <line x1="22.95" y1="53" x2="16.89" y2="56.5"/>
    <line x1="20" y1="42" x2="13" y2="42"/>
    <line x1="22.95" y1="31" x2="16.89" y2="27.5"/>
    <line x1="31" y1="22.95" x2="27.5" y2="16.89"/>
    <line x1="42" y1="20" x2="42" y2="13"/>
    <line x1="53" y1="22.95" x2="56.5" y2="16.89"/>
    <line x1="61.05" y1="31" x2="67.11" y2="27.5"/>
  </g>
  <g fill="#065f46">
    <circle cx="71" cy="42" r="2.4"/>
    <circle cx="42" cy="71" r="2.4"/>
    <circle cx="27.5" cy="67.11" r="2.4"/>
    <circle cx="16.89" cy="56.5" r="2.4"/>
    <circle cx="13" cy="42" r="2.4"/>
    <circle cx="16.89" cy="27.5" r="2.4"/>
    <circle cx="27.5" cy="16.89" r="2.4"/>
    <circle cx="42" cy="13" r="2.4"/>
    <circle cx="56.5" cy="16.89" r="2.4"/>
    <circle cx="67.11" cy="27.5" r="2.4"/>
  </g>

  <circle cx="42" cy="42" r="22" fill="url(#hsv_env)"/>
  <circle cx="42" cy="42" r="22" fill="url(#hsv_hl)"/>
  <circle cx="42" cy="42" r="22" fill="none" stroke="#065f46" stroke-width="1.8"/>

  <!-- tegument ring -->
  <circle cx="42" cy="42" r="17" fill="none" stroke="#a7f3d0" stroke-width="1.4" stroke-dasharray="2.4 2.2" stroke-opacity="0.9"/>

  <!-- === Icosahedral capsid === -->
  <polygon points="42,29 53.3,35.5 53.3,48.5 42,55 30.7,48.5 30.7,35.5" fill="url(#hsv_capsid)" stroke="#065f46" stroke-width="1.5"/>
  <g stroke="#047857" stroke-width="1" stroke-opacity="0.7" fill="none">
    <path d="M42 29 L42 42 L53.3 35.5"/>
    <path d="M42 42 L53.3 48.5"/>
    <path d="M42 42 L42 55"/>
    <path d="M42 42 L30.7 48.5"/>
    <path d="M42 42 L30.7 35.5"/>
  </g>

  <!-- === dsDNA genome (~152 kb) inside capsid === -->
  <path d="M37 40 A6 6 0 1 1 47 44" stroke="#065f46" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M38.8 41.8 A3.8 3.8 0 1 1 45.2 44.2" stroke="#34d399" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-dasharray="2.5 1.8"/>
</svg>
