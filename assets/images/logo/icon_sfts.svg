<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sfts_env" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </radialGradient>
    <radialGradient id="sfts_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#f3e5f5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4a148c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sfts_tick" cx="40%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
  </defs>

  <!-- === Enveloped virion with Gn/Gc spikes === -->
  <circle cx="38" cy="40" r="28" fill="url(#sfts_env)"/>
  <circle cx="38" cy="40" r="28" fill="url(#sfts_hl)"/>
  <circle cx="38" cy="40" r="28" fill="none" stroke="#311b92" stroke-width="1.8"/>

  <!-- Gn/Gc surface spikes -->
  <g stroke="#311b92" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="38" y1="12" x2="38" y2="6"/>
    <line x1="58" y1="20" x2="62" y2="16"/>
    <line x1="66" y1="40" x2="72" y2="40"/>
    <line x1="58" y1="60" x2="62" y2="64"/>
    <line x1="18" y1="60" x2="14" y2="64"/>
    <line x1="10" y1="40" x2="4" y2="40"/>
    <line x1="18" y1="20" x2="14" y2="16"/>
  </g>
  <g fill="#7b1fa2">
    <circle cx="38" cy="5" r="2.4"/>
    <circle cx="63" cy="15" r="2.4"/>
    <circle cx="73" cy="40" r="2.4"/>
    <circle cx="63" cy="65" r="2.4"/>
    <circle cx="13" cy="65" r="2.4"/>
    <circle cx="3" cy="40" r="2.4"/>
    <circle cx="13" cy="15" r="2.4"/>
  </g>

  <!-- === Segmented genome: L / M / S ribonucleoproteins === -->
  <path d="M26 32 Q31 28 36 32 T46 32 T56 32" stroke="#ede7f6" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M28 42 Q32 38 36 42 T44 42" stroke="#d1c4e9" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M30 52 Q33 49 36 52 T42 52" stroke="#b39ddb" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <g fill="#ede7f6">
    <circle cx="26" cy="32" r="1.3"/>
    <circle cx="56" cy="32" r="1.3"/>
    <circle cx="28" cy="42" r="1.3"/>
    <circle cx="44" cy="42" r="1.3"/>
    <circle cx="30" cy="52" r="1.3"/>
    <circle cx="42" cy="52" r="1.3"/>
  </g>

  <!-- === Tick vector (Haemaphysalis longicornis) === -->
  <g transform="translate(72 76)">
    <!-- legs -->
    <g stroke="#3e2723" stroke-width="1.8" stroke-linecap="round" fill="none">
      <path d="M-8 -2 L-16 -8"/>
      <path d="M-10 2 L-19 0"/>
      <path d="M-10 6 L-19 9"/>
      <path d="M-8 10 L-15 16"/>
      <path d="M8 -2 L16 -8"/>
      <path d="M10 2 L19 0"/>
      <path d="M10 6 L19 9"/>
      <path d="M8 10 L15 16"/>
    </g>
    <!-- body (idiosoma) -->
    <ellipse cx="0" cy="5" rx="11" ry="12" fill="url(#sfts_tick)" stroke="#281510" stroke-width="1.5"/>
    <!-- scutum -->
    <path d="M-7 -1 A8 8 0 0 1 7 -1 L5 5 Q0 8 -5 5 Z" fill="#5d4037"/>
    <!-- capitulum -->
    <path d="M-2 -6 L0 -11 L2 -6 Z" fill="#3e2723"/>
    <line x1="0" y1="-11" x2="-3" y2="-14" stroke="#3e2723" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="0" y1="-11" x2="3" y2="-14" stroke="#3e2723" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
