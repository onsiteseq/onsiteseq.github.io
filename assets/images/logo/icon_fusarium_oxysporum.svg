<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="fo_mc" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </radialGradient>
    <radialGradient id="fo_mc2" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#ad1457"/>
    </radialGradient>
    <radialGradient id="fo_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#f3e5f5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b1fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fo_ch" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </radialGradient>
  </defs>

  <!-- === Large sickle-shaped macroconidium === -->
  <path d="M14 78 Q42 26 86 30 Q52 44 26 84 Z" fill="url(#fo_mc)"
        stroke="#6a1b9a" stroke-width="1.5" opacity="0.95"/>
  <path d="M14 78 Q42 26 86 30 Q52 44 26 84 Z" fill="url(#fo_hl)"/>
  <!-- Septa -->
  <path d="M32 58 L41 67" stroke="#4a148c" stroke-width="1.2" opacity="0.6"/>
  <path d="M45 46 L54 55" stroke="#4a148c" stroke-width="1.2" opacity="0.6"/>
  <path d="M58 38 L67 46" stroke="#4a148c" stroke-width="1.2" opacity="0.6"/>
  <path d="M70 33 L78 40" stroke="#4a148c" stroke-width="1.2" opacity="0.6"/>

  <!-- === Smaller macroconidium === -->
  <path d="M22 94 Q46 64 76 66 Q50 74 32 96 Z" fill="url(#fo_mc2)"
        stroke="#880e4f" stroke-width="1.2" opacity="0.9"/>
  <path d="M40 80 L47 87" stroke="#880e4f" stroke-width="1" opacity="0.6"/>
  <path d="M53 72 L59 80" stroke="#880e4f" stroke-width="1" opacity="0.6"/>

  <!-- === Oval microconidia === -->
  <ellipse cx="20" cy="30" rx="4" ry="6" fill="url(#fo_mc)" opacity="0.8"
           transform="rotate(-25 20 30)"/>
  <ellipse cx="14" cy="44" rx="3.5" ry="5" fill="url(#fo_mc2)" opacity="0.8"
           transform="rotate(-15 14 44)"/>
  <ellipse cx="30" cy="18" rx="3" ry="4.5" fill="url(#fo_mc)" opacity="0.7"
           transform="rotate(20 30 18)"/>

  <!-- === Thick-walled chlamydospore (double ring) === -->
  <circle cx="80" cy="78" r="9" fill="none" stroke="#4527a0" stroke-width="1.8" opacity="0.8"/>
  <circle cx="80" cy="78" r="7" fill="url(#fo_ch)"/>
  <circle cx="80" cy="78" r="7" fill="url(#fo_hl)"/>
</svg>
