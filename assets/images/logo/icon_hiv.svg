<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    ВИЧ-1, вирион в разрезе.

    Отличительные черты, по которым вирион узнаётся и которых не было
    в прежней пиктограмме:
      - КОНИЧЕСКИЙ капсид (p24) — главный морфологический признак
        лентивирусов; у большинства вирусов капсид икосаэдрический;
      - РЕДКИЕ шипы Env (тример gp120 на ножке gp41) — на вирионе их
        всего ~10-15, в отличие от густой «короны» SARS-CoV-2;
      - две копии (+)оцРНК внутри капсида (вирус диплоидный);
      - матрикс p17 под липидной оболочкой.

    Подписи субтипов намеренно отсутствуют: на прежнем логотипе стояли
    «B2», «C2», «1/3» — таких субтипов ВИЧ-1 не существует (реальные:
    A1, A2, A6, B, C, D, F1, F2, G, H, J, K, L и CRF, например
    CRF02_AG и CRF63_02A6).
  -->
  <defs>
    <radialGradient id="hiv_env" cx="36%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#9575cd"/>
      <stop offset="100%" stop-color="#311b92"/>
    </radialGradient>
    <radialGradient id="hiv_hl" cx="32%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#ede7f6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#311b92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hiv_capsid" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <radialGradient id="hiv_knob" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </radialGradient>
  </defs>

  <!-- === Шипы Env: тример gp120 (головка) на ножке gp41 === -->
  <!-- Редкие и неравномерные — так они и расположены на вирионе -->
  <g stroke="#4527a0" stroke-width="2.4" stroke-linecap="round">
    <line x1="50" y1="19" x2="50" y2="10"/>
    <line x1="72" y1="26" x2="78" y2="19"/>
    <line x1="83" y1="45" x2="92" y2="42"/>
    <line x1="79" y1="68" x2="86" y2="74"/>
    <line x1="57" y1="84" x2="60" y2="92"/>
    <line x1="33" y1="80" x2="28" y2="87"/>
    <line x1="18" y1="60" x2="9" y2="63"/>
    <line x1="19" y1="37" x2="11" y2="33"/>
    <line x1="33" y1="22" x2="29" y2="14"/>
  </g>
  <g fill="url(#hiv_knob)" stroke="#311b92" stroke-width="1.1">
    <ellipse cx="50" cy="8"  rx="5.2" ry="3.6"/>
    <ellipse cx="80" cy="17" rx="5.2" ry="3.6"/>
    <ellipse cx="94" cy="41" rx="5.2" ry="3.6"/>
    <ellipse cx="88" cy="76" rx="5.2" ry="3.6"/>
    <ellipse cx="61" cy="94" rx="5.2" ry="3.6"/>
    <ellipse cx="26" cy="89" rx="5.2" ry="3.6"/>
    <ellipse cx="7"  cy="64" rx="5.2" ry="3.6"/>
    <ellipse cx="9"  cy="32" rx="5.2" ry="3.6"/>
    <ellipse cx="28" cy="12" rx="5.2" ry="3.6"/>
  </g>

  <!-- === Липидная оболочка === -->
  <circle cx="50" cy="51" r="33" fill="url(#hiv_env)"/>
  <circle cx="50" cy="51" r="33" fill="url(#hiv_hl)"/>
  <circle cx="50" cy="51" r="33" fill="none" stroke="#1a0a5c" stroke-width="2"/>

  <!-- Матрикс p17: тонкий слой под оболочкой -->
  <circle cx="50" cy="51" r="28.5" fill="none" stroke="#7e57c2"
          stroke-width="1.6" stroke-opacity="0.75"/>

  <!-- === Конический капсид p24 (ключевой признак) === -->
  <!-- Усечённый конус, ось наклонена сверху-слева вниз-вправо: узкое
       усечённое основание вверху, широкое — внизу справа. Оба торца
       скруглены — на срезах электронной микроскопии они видны как эллипсы. -->
  <path d="M46.4 31.2
           L72.0 59.4 C75.0 64.7 49.4 79.2 46.4 73.9
           L35.2 37.7 C34.0 35.6 45.2 29.1 46.4 31.2 Z"
        fill="url(#hiv_capsid)" stroke="#8e0000" stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Две копии (+)оцРНК внутри капсида, вдоль его оси: вирус диплоидный -->
  <g fill="none" stroke="#fff3e0" stroke-width="1.4" stroke-linecap="round"
     stroke-opacity="0.9">
    <path d="M42.6 39.0 C47.2 44.6 43.6 49.2 48.2 54.7 C51.8 59.3 49.1 63.0 53.7 67.6"/>
    <path d="M45.4 36.3 C50.0 40.2 46.3 46.4 50.9 51.9 C54.6 56.5 51.8 61.1 57.4 66.6"/>
  </g>

  <!-- Обратная транскриптаза и интеграза внутри капсида -->
  <g fill="#ffe0b2" fill-opacity="0.9">
    <circle cx="57.4" cy="61.1" r="2.1"/>
    <circle cx="50.0" cy="63.0" r="1.8"/>
    <circle cx="46.3" cy="44.6" r="1.5"/>
  </g>
</svg>
