<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="pv_sp" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d1c4e9"/>
      <stop offset="100%" stop-color="#5e35b1"/>
    </radialGradient>
    <radialGradient id="pv_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ede7f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5e35b1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pv_leaf" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a5d6a7"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
    <linearGradient id="pv_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e57c2"/>
      <stop offset="100%" stop-color="#4527a0"/>
    </linearGradient>
  </defs>

  <!-- === Grape leaf with oily spot === -->
  <path d="M74 94 C 56 86 52 66 62 53 C 70 43 87 44 92 57 C 97 69 90 87 74 94 Z"
        fill="url(#pv_leaf)" stroke="#1b5e20" stroke-width="1.6" opacity="0.95"/>
  <!-- Petiole -->
  <path d="M74 94 Q68 97 62 99" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Veins -->
  <path d="M74 90 L64 58" stroke="#1b5e20" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M74 90 L88 60" stroke="#1b5e20" stroke-width="1" opacity="0.5" fill="none"/>
  <path d="M74 90 L76 52" stroke="#1b5e20" stroke-width="1" opacity="0.5" fill="none"/>
  <!-- Oily (oil-spot) lesion -->
  <ellipse cx="76" cy="66" rx="9" ry="7" fill="#fdd835" opacity="0.55"/>
  <ellipse cx="76" cy="66" rx="9" ry="7" fill="none" stroke="#f9a825" stroke-width="1" opacity="0.6"/>

  <!-- === Sporangiophore (tree-like, purple tones) === -->
  <path d="M30 96 Q30 76 30 60" stroke="url(#pv_stem)" stroke-width="3"
        stroke-linecap="round" fill="none"/>
  <path d="M30 72 Q22 64 16 55" stroke="#7e57c2" stroke-width="2.2"
        stroke-linecap="round" fill="none"/>
  <path d="M30 72 Q38 64 44 55" stroke="#7e57c2" stroke-width="2.2"
        stroke-linecap="round" fill="none"/>
  <path d="M16 55 Q12 48 10 42" stroke="#9575cd" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M16 55 Q20 47 22 41" stroke="#9575cd" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M44 55 Q40 47 38 41" stroke="#9575cd" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M44 55 Q48 48 50 42" stroke="#9575cd" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M30 60 Q30 50 30 40" stroke="#7e57c2" stroke-width="2"
        stroke-linecap="round" fill="none"/>

  <!-- === Lemon-shaped sporangia at tips === -->
  <ellipse cx="9" cy="36" rx="4" ry="5.5" fill="url(#pv_sp)" stroke="#4527a0" stroke-width="1" transform="rotate(-15 9 36)"/>
  <ellipse cx="9" cy="36" rx="4" ry="5.5" fill="url(#pv_hl)" transform="rotate(-15 9 36)"/>
  <ellipse cx="23" cy="35" rx="4" ry="5.5" fill="url(#pv_sp)" stroke="#4527a0" stroke-width="1"/>
  <ellipse cx="23" cy="35" rx="4" ry="5.5" fill="url(#pv_hl)"/>
  <ellipse cx="37" cy="35" rx="4" ry="5.5" fill="url(#pv_sp)" stroke="#4527a0" stroke-width="1"/>
  <ellipse cx="37" cy="35" rx="4" ry="5.5" fill="url(#pv_hl)"/>
  <ellipse cx="51" cy="36" rx="4" ry="5.5" fill="url(#pv_sp)" stroke="#4527a0" stroke-width="1" transform="rotate(15 51 36)"/>
  <ellipse cx="51" cy="36" rx="4" ry="5.5" fill="url(#pv_hl)" transform="rotate(15 51 36)"/>
  <ellipse cx="30" cy="32" rx="4.5" ry="6" fill="url(#pv_sp)" stroke="#4527a0" stroke-width="1"/>
  <ellipse cx="30" cy="32" rx="4.5" ry="6" fill="url(#pv_hl)"/>
</svg>
