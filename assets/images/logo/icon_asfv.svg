    <path d="M50 50 L71 37"/>
    <path d="M50 50 L71 63"/>
    <path d="M50 50 L50 76"/>
    <path d="M50 50 L29 63"/>
  </g>

  <!-- === DNA core === -->
  <path d="M42 44 Q47 40 52 44 T62 44" stroke="#fff3e0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M38 56 Q43 52 48 56 T58 56" stroke="#fff3e0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
