      <stop offset="0%" stop-color="#ef9a9a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="asfv_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffebee" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="asfv_spike" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#5c1010"/>
    </linearGradient>
  </defs>

  <!-- === Spike projections (envelope glycoproteins) === -->
  <g stroke="url(#asfv_spike)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M50 22 L50 8"/>
    <path d="M70 28 L78 16"/>
    <path d="M81 45 L95 40"/>
    <path d="M79 64 L91 72"/>
    <path d="M63 78 L70 91"/>
    <path d="M41 80 L38 94"/>
    <path d="M23 68 L12 76"/>
    <path d="M18 47 L4 43"/>
    <path d="M27 30 L18 19"/>
  </g>
  <g fill="#b71c1c">
    <circle cx="50" cy="8" r="3"/>
    <circle cx="78" cy="16" r="3"/>
    <circle cx="95" cy="40" r="3"/>
    <circle cx="91" cy="72" r="3"/>
    <circle cx="70" cy="91" r="3"/>
    <circle cx="38" cy="94" r="3"/>
    <circle cx="12" cy="76" r="3"/>
    <circle cx="4" cy="43" r="3"/>
    <circle cx="18" cy="19" r="3"/>
