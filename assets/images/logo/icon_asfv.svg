  <!-- === Envelope === -->
  <circle cx="50" cy="50" r="30" fill="url(#asfv_g)"/>
  <circle cx="50" cy="50" r="30" fill="url(#asfv_hl)"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#5c1010" stroke-width="1.8"/>

  <!-- === Icosahedral capsid edges === -->
  <g stroke="#ffcdd2" stroke-width="1.3" stroke-opacity="0.75" fill="none">
    <path d="M50 24 L71 37 L71 63 L50 76 L29 63 L29 37 Z"/>
