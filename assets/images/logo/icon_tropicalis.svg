<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ctr_trop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="ctr_krusei" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <radialGradient id="ctr_nuc" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </radialGradient>
    <linearGradient id="ctr_frond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aed581"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <radialGradient id="ctr_hl" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#00695c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === C. tropicalis: large budding yeast cell (teal) === -->
  <g>
    <!-- bud (daughter cell) -->
    <ellipse cx="52" cy="40" rx="8.5" ry="7.5" fill="url(#ctr_trop)" stroke="#004d40" stroke-width="1.6"/>
    <circle cx="52" cy="40" r="3" fill="url(#ctr_nuc)" stroke="#f57f17" stroke-width="0.8"/>
    <!-- mother cell -->
    <ellipse cx="36" cy="56" rx="17" ry="15" fill="url(#ctr_trop)" stroke="#004d40" stroke-width="1.8"/>
    <!-- nucleus -->
    <ellipse cx="34" cy="58" rx="6.5" ry="5.5" fill="url(#ctr_nuc)" stroke="#f57f17" stroke-width="1"/>
    <!-- glossy highlight -->
    <ellipse cx="29" cy="47" rx="7" ry="3.5" fill="url(#ctr_hl)" transform="rotate(-18 29 47)"/>
  </g>

  <!-- === C. krusei: smaller budding yeast cell (amber) === -->
  <g>
    <!-- bud -->
    <ellipse cx="79" cy="48" rx="5.5" ry="5" fill="url(#ctr_krusei)" stroke="#bf360c" stroke-width="1.4"/>
    <circle cx="79" cy="48" r="2" fill="url(#ctr_nuc)" stroke="#f57f17" stroke-width="0.7"/>
    <!-- mother cell -->
    <ellipse cx="68" cy="64" rx="11.5" ry="10.5" fill="url(#ctr_krusei)" stroke="#bf360c" stroke-width="1.6"/>
    <ellipse cx="66" cy="66" rx="4.5" ry="4" fill="url(#ctr_nuc)" stroke="#f57f17" stroke-width="0.9"/>
    <ellipse cx="63" cy="59" rx="4.5" ry="2.2" fill="url(#ctr_hl)" transform="rotate(-18 63 59)"/>
  </g>

  <!-- === Palm frond (tropicalis motif) === -->
  <g stroke="#33691e" stroke-width="1.1" fill="none">
    <path d="M88 90 Q92 66 84 44"/>
  </g>
  <g fill="url(#ctr_frond)" stroke="#33691e" stroke-width="0.9">
    <!-- leaflets along the stem -->
    <path d="M87 82 Q96 76 97 68 Q89 71 86 76 Z"/>
    <path d="M89 70 Q98 66 99 58 Q91 60 88 65 Z"/>
    <path d="M89 58 Q97 53 97 46 Q90 48 88 53 Z"/>
    <path d="M86 80 Q78 75 77 67 Q84 69 87 75 Z"/>
    <path d="M88 68 Q80 64 79 56 Q86 58 89 63 Z"/>
    <path d="M87 56 Q80 52 80 45 Q86 47 88 51 Z"/>
    <!-- frond tip -->
    <path d="M84 44 Q86 34 92 30 Q90 39 87 44 Z"/>
  </g>

  <!-- === Budding spores / sparkle dots === -->
  <g fill="#fff3e0" stroke="#ef6c00" stroke-width="0.9">
    <circle cx="14" cy="30" r="3.2"/>
    <circle cx="24" cy="18" r="2.4"/>
    <circle cx="62" cy="86" r="2.8"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="13" cy="29" r="0.9"/>
    <circle cx="23.2" cy="17.2" r="0.7"/>
    <circle cx="61" cy="85" r="0.8"/>
  </g>
</svg>
