<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="mb_island" cx="42%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#f1f8e9"/>
      <stop offset="55%" stop-color="#c5e1a5"/>
      <stop offset="100%" stop-color="#8bc34a"/>
    </radialGradient>
    <radialGradient id="mb_rod_gold" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <radialGradient id="mb_rod_green" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
    <radialGradient id="mb_coccus" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </radialGradient>
    <radialGradient id="mb_hl" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8bc34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === "Island" niche (mucosal patch / colony) === -->
  <path d="M50 8 C74 8 92 26 93 50 C94 74 76 92 52 93 C28 94 8 76 7 52 C6 28 26 8 50 8 Z"
        fill="url(#mb_island)" stroke="#33691e" stroke-width="2"/>
  <path d="M50 8 C74 8 92 26 93 50 C94 74 76 92 52 93 C28 94 8 76 7 52 C6 28 26 8 50 8 Z"
        fill="url(#mb_hl)"/>
  <!-- island border hint -->
  <path d="M50 14 C71 14 86 30 87 50 C88 71 72 87 52 87 C32 88 14 72 13 52 C13 31 29 14 50 14 Z"
        fill="none" stroke="#558b2f" stroke-width="1" stroke-opacity="0.5"/>

  <!-- === Rod 1 (golden bacillus) === -->
  <g transform="rotate(-28 38 38)">
    <rect x="20" y="32" width="36" height="12" rx="6" fill="url(#mb_rod_gold)" stroke="#e65100" stroke-width="1.5"/>
    <rect x="24" y="34.5" width="20" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.45"/>
  </g>

  <!-- === Rod 2 (green bacillus) === -->
  <g transform="rotate(18 64 66)">
    <rect x="46" y="60" width="36" height="12" rx="6" fill="url(#mb_rod_green)" stroke="#1b5e20" stroke-width="1.5"/>
    <rect x="50" y="62.5" width="20" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.4"/>
    <!-- flagellum -->
    <path d="M46 66 Q38 62 34 54" fill="none" stroke="#2e7d32" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- === Coccus cluster (staphylococcus-like) === -->
  <g stroke="#e65100" stroke-width="1.2">
    <circle cx="68" cy="34" r="6.5" fill="url(#mb_coccus)"/>
    <circle cx="58" cy="42" r="5.5" fill="url(#mb_coccus)"/>
    <circle cx="76" cy="44" r="5" fill="url(#mb_coccus)"/>
    <circle cx="66" cy="47" r="4.2" fill="url(#mb_coccus)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="65.8" cy="31.8" r="1.7"/>
    <circle cx="56.2" cy="40.2" r="1.4"/>
    <circle cx="74.3" cy="42.3" r="1.2"/>
  </g>

  <!-- === Spirillum (spiral bacterium) === -->
  <path d="M20 66 q5 -8 10 0 q5 8 10 0 q5 -8 10 0"
        fill="none" stroke="#6d4c41" stroke-width="3" stroke-linecap="round"/>
  <path d="M20 66 q5 -8 10 0 q5 8 10 0 q5 -8 10 0"
        fill="none" stroke="#ffb300" stroke-width="1.4" stroke-linecap="round"/>

  <!-- === Small diplococci pair === -->
  <circle cx="30" cy="76" r="4.5" fill="url(#mb_rod_green)" stroke="#1b5e20" stroke-width="1.1"/>
  <circle cx="39" cy="79" r="4.5" fill="url(#mb_rod_green)" stroke="#1b5e20" stroke-width="1.1"/>

  <!-- === Tiny background microbes (diversity dots) === -->
  <g fill="#558b2f" fill-opacity="0.45">
    <circle cx="26" cy="52" r="2"/>
    <circle cx="50" cy="28" r="2"/>
    <circle cx="82" cy="58" r="2"/>
    <circle cx="54" cy="80" r="2"/>
    <circle cx="74" cy="74" r="1.6"/>
  </g>
</svg>
