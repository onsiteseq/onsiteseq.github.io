<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="mal_yeast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#a05a12"/>
    </linearGradient>
    <radialGradient id="mal_bud" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#e6a23c"/>
    </radialGradient>
    <radialGradient id="mal_lipid" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <radialGradient id="mal_hl" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a05a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === Lipid droplets (lipophilic yeast feeds on Intralipid) === -->
  <g stroke="#c17900" stroke-width="1.2">
    <circle cx="24" cy="30" r="8.5" fill="url(#mal_lipid)"/>
    <circle cx="82" cy="72" r="6" fill="url(#mal_lipid)"/>
    <circle cx="76" cy="20" r="4.5" fill="url(#mal_lipid)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="21.5" cy="27" r="2.2"/>
    <circle cx="80.2" cy="70" r="1.5"/>
    <circle cx="74.8" cy="18.6" r="1.1"/>
  </g>

  <!-- === Large budding yeast cell: broad-based budding (Malassezia trait) === -->
  <g stroke="#7a4200" stroke-width="1.8">
    <!-- mother cell -->
    <ellipse cx="45" cy="58" rx="19" ry="15.5" transform="rotate(-14 45 58)" fill="url(#mal_yeast)"/>
    <!-- daughter bud fused at a wide base (no narrow neck) -->
    <path d="M56.5 44.5 Q69 33 72.5 43.5 Q76 54 62.5 57 Q55 58.5 56.5 44.5 Z" fill="url(#mal_bud)"/>
  </g>
  <!-- collar ring at the broad budding site (bud scar) -->
  <path d="M57.5 45.5 Q63 49.5 62.5 55.5" stroke="#7a4200" stroke-width="1.2" fill="none" stroke-opacity="0.7"/>
  <!-- nucleus -->
  <ellipse cx="41" cy="60" rx="6" ry="5" transform="rotate(-14 41 60)" fill="#ffecb3" stroke="#a05a12" stroke-width="1.1"/>
  <!-- glossy highlight on mother cell -->
  <ellipse cx="37" cy="50" rx="8.5" ry="4" transform="rotate(-14 37 50)" fill="url(#mal_hl)"/>

  <!-- === Small budding yeast cell === -->
  <g stroke="#7a4200" stroke-width="1.5">
    <ellipse cx="74" cy="76" rx="10.5" ry="8.5" transform="rotate(12 74 76)" fill="url(#mal_yeast)"/>
    <path d="M80.5 68.5 Q88 62.5 89.5 68.5 Q91 74.5 83 76 Q79.5 76.5 80.5 68.5 Z" fill="url(#mal_bud)"/>
  </g>
  <ellipse cx="70.5" cy="72.5" rx="4.5" ry="2.2" transform="rotate(12 70.5 72.5)" fill="url(#mal_hl)"/>

  <!-- === Tiny free buds === -->
  <g stroke="#7a4200" stroke-width="1.2" fill="url(#mal_bud)">
    <circle cx="30" cy="79" r="4.2"/>
    <circle cx="16" cy="55" r="3.2"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.8">
    <circle cx="28.8" cy="77.7" r="1"/>
    <circle cx="15.2" cy="54" r="0.8"/>
  </g>
</svg>
