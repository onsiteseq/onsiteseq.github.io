<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="as_con" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
    <radialGradient id="as_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#d7ccc8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3e2723" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="as_beak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>

  <!-- === Beak (apical extension) === -->
  <path d="M45 30 Q50 18 58 10" stroke="url(#as_beak)" stroke-width="5"
        stroke-linecap="round" fill="none"/>

  <!-- === Muriform (brick-walled) conidium === -->
  <ellipse cx="45" cy="56" rx="20" ry="26" fill="url(#as_con)"/>
  <ellipse cx="45" cy="56" rx="20" ry="26" fill="url(#as_hl)"/>
  <ellipse cx="45" cy="56" rx="20" ry="26" fill="none" stroke="#26120c"
           stroke-width="1.8" opacity="0.8"/>

  <!-- Longitudinal septa -->
  <path d="M37 34 Q36 56 37 78" stroke="#26120c" stroke-width="1.4" opacity="0.7" fill="none"/>
  <path d="M45 32 Q45 56 45 80" stroke="#26120c" stroke-width="1.4" opacity="0.7" fill="none"/>
  <path d="M53 34 Q54 56 53 78" stroke="#26120c" stroke-width="1.4" opacity="0.7" fill="none"/>
  <!-- Transverse septa -->
  <path d="M28 45 Q45 43 62 45" stroke="#26120c" stroke-width="1.4" opacity="0.7" fill="none"/>
  <path d="M26 56 Q45 54 64 56" stroke="#26120c" stroke-width="1.4" opacity="0.7" fill="none"/>
  <path d="M28 67 Q45 65 62 67" stroke="#26120c" stroke-width="1.4" opacity="0.7" fill="none"/>

  <!-- === Small secondary conidium === -->
  <ellipse cx="78" cy="72" rx="10" ry="14" fill="url(#as_con)"
           transform="rotate(20 78 72)"/>
  <ellipse cx="78" cy="72" rx="10" ry="14" fill="url(#as_hl)"
           transform="rotate(20 78 72)"/>
  <ellipse cx="78" cy="72" rx="10" ry="14" fill="none" stroke="#26120c"
           stroke-width="1.4" opacity="0.8" transform="rotate(20 78 72)"/>
  <path d="M72 66 Q78 64 84 66" stroke="#26120c" stroke-width="1.1" opacity="0.7" fill="none"/>
  <path d="M71 74 Q78 72 85 74" stroke="#26120c" stroke-width="1.1" opacity="0.7" fill="none"/>
  <path d="M78 60 Q78 72 78 84" stroke="#26120c" stroke-width="1.1" opacity="0.7" fill="none"/>

  <!-- === Free conidia in the air === -->
  <ellipse cx="16" cy="22" rx="4" ry="6" fill="url(#as_con)" opacity="0.7"
           transform="rotate(-20 16 22)"/>
  <ellipse cx="30" cy="10" rx="3" ry="4.5" fill="url(#as_con)" opacity="0.6"
           transform="rotate(15 30 10)"/>
</svg>
