<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="nm1" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00695c"/>
    </radialGradient>
    <radialGradient id="nm2" cx="62%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00695c"/>
    </radialGradient>
    <radialGradient id="nm_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#e0f2f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00695c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Capsule halo — left coccus -->
  <circle cx="37" cy="52" r="25" fill="none" stroke="#004d40" stroke-width="2.5"
          stroke-dasharray="4 2" opacity="0.45"/>
  <!-- Left kidney-shaped diplococcus body -->
  <ellipse cx="37" cy="52" rx="20" ry="21.5" fill="url(#nm1)"/>
  <ellipse cx="37" cy="52" rx="20" ry="21.5" fill="url(#nm_hl)"/>
  <ellipse cx="37" cy="52" rx="20" ry="21.5" fill="none" stroke="#004d40"
           stroke-width="1.4" opacity="0.7"/>
  <!-- Left indent (flattened adjoining side) -->
  <ellipse cx="55.5" cy="52" rx="6" ry="10.5" fill="#004d40" opacity="0.25"/>

  <!-- Capsule halo — right coccus -->
  <circle cx="63" cy="52" r="25" fill="none" stroke="#004d40" stroke-width="2.5"
          stroke-dasharray="4 2" opacity="0.45"/>
  <!-- Right diplococcus body -->
  <ellipse cx="63" cy="52" rx="20" ry="21.5" fill="url(#nm2)"/>
  <ellipse cx="63" cy="52" rx="20" ry="21.5" fill="url(#nm_hl)"/>
  <ellipse cx="63" cy="52" rx="20" ry="21.5" fill="none" stroke="#004d40"
           stroke-width="1.4" opacity="0.7"/>
  <!-- Right indent -->
  <ellipse cx="44.5" cy="52" rx="6" ry="10.5" fill="#004d40" opacity="0.25"/>

  <!-- Pili — left -->
  <line x1="19" y1="38" x2="11" y2="28" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="15" y1="48" x2="5"  y2="44" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="21" y1="64" x2="12" y2="72" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="31" y1="72" x2="27" y2="83" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <!-- Pili — right -->
  <line x1="81" y1="38" x2="89" y2="28" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="85" y1="48" x2="95" y2="44" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="79" y1="64" x2="88" y2="72" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="69" y1="72" x2="73" y2="83" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <!-- Top pili -->
  <line x1="37" y1="30" x2="33" y2="19" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="63" y1="30" x2="67" y2="19" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="50" y1="28" x2="50" y2="15" stroke="#00897b" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>

  <!-- Nucleoid dots inside each coccus -->
  <ellipse cx="34" cy="50" rx="6" ry="5" fill="#00332c" opacity="0.35"/>
  <ellipse cx="66" cy="50" rx="6" ry="5" fill="#00332c" opacity="0.35"/>

  <!-- Second diplococcus pair (dividing cells) -->
  <g transform="rotate(-25 30 84)" opacity="0.65">
    <ellipse cx="26" cy="84" rx="7" ry="8" fill="url(#nm1)"/>
    <ellipse cx="26" cy="84" rx="7" ry="8" fill="url(#nm_hl)"/>
    <ellipse cx="26" cy="84" rx="7" ry="8" fill="none" stroke="#004d40" stroke-width="1" opacity="0.6"/>
    <ellipse cx="36" cy="84" rx="7" ry="8" fill="url(#nm2)"/>
    <ellipse cx="36" cy="84" rx="7" ry="8" fill="url(#nm_hl)"/>
    <ellipse cx="36" cy="84" rx="7" ry="8" fill="none" stroke="#004d40" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
