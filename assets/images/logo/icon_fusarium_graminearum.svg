<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="fg_mc" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <radialGradient id="fg_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fg_grain" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <linearGradient id="fg_rachis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
  </defs>

  <!-- === Sickle-shaped macroconidium === -->
  <path d="M8 66 Q28 22 66 24 Q38 36 18 72 Z" fill="url(#fg_mc)"
        stroke="#bf360c" stroke-width="1.5" opacity="0.95"/>
  <path d="M8 66 Q28 22 66 24 Q38 36 18 72 Z" fill="url(#fg_hl)"/>
  <!-- Septa -->
  <path d="M22 50 L30 58" stroke="#bf360c" stroke-width="1.2" opacity="0.6"/>
  <path d="M33 40 L41 48" stroke="#bf360c" stroke-width="1.2" opacity="0.6"/>
  <path d="M45 32 L53 40" stroke="#bf360c" stroke-width="1.2" opacity="0.6"/>

  <!-- === Wheat ear === -->
  <!-- Rachis -->
  <path d="M76 96 Q76 64 76 34" stroke="url(#fg_rachis)" stroke-width="2.5"
        stroke-linecap="round" fill="none"/>
  <!-- Spikelets -->
  <ellipse cx="70" cy="44" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(-20 70 44)"/>
  <ellipse cx="82" cy="44" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(20 82 44)"/>
  <ellipse cx="70" cy="56" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(-20 70 56)"/>
  <ellipse cx="82" cy="56" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(20 82 56)"/>
  <ellipse cx="70" cy="68" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(-20 70 68)"/>
  <ellipse cx="82" cy="68" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(20 82 68)"/>
  <ellipse cx="70" cy="80" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(-20 70 80)"/>
  <ellipse cx="82" cy="80" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1" transform="rotate(20 82 80)"/>
  <ellipse cx="76" cy="32" rx="4" ry="7" fill="url(#fg_grain)" stroke="#f57f17" stroke-width="1"/>
  <!-- Awns -->
  <line x1="70" y1="38" x2="62" y2="18" stroke="#f9a825" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="82" y1="38" x2="90" y2="18" stroke="#f9a825" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="76" y1="26" x2="76" y2="8" stroke="#f9a825" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="73" y1="28" x2="68" y2="10" stroke="#fbc02d" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <line x1="79" y1="28" x2="84" y2="10" stroke="#fbc02d" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- === Scattered small conidia === -->
  <ellipse cx="24" cy="88" rx="3" ry="4.5" fill="url(#fg_mc)" opacity="0.7" transform="rotate(-15 24 88)"/>
  <ellipse cx="40" cy="82" rx="2.5" ry="4" fill="url(#fg_mc)" opacity="0.6" transform="rotate(20 40 82)"/>
</svg>
