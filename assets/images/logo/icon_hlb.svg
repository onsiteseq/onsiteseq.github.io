<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="hlb_fruit" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="60%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <radialGradient id="hlb_fruit_hl" cx="32%" cy="26%" r="50%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hlb_leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
    <radialGradient id="hlb_mottle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dce775" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#afb42b" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="hlb_psyllid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
    <linearGradient id="hlb_wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8d6e63" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- === Branch === -->
  <path d="M50 8 Q52 22 54 32" stroke="#5d4037" stroke-width="3"
        stroke-linecap="round" fill="none"/>

  <!-- === Leaf with blotchy mottle (asymmetric yellow-green blotches) === -->
  <path d="M52 18 Q30 8 14 16 Q26 30 50 27 Z" fill="url(#hlb_leaf)"
        stroke="#2e5218" stroke-width="1"/>
  <path d="M50 22 Q32 16 17 17" stroke="#2e5218" stroke-width="0.8"
        fill="none" opacity="0.7"/>
  <!-- asymmetric blotchy mottle spots -->
  <ellipse cx="38" cy="17" rx="4.5" ry="2.6" fill="url(#hlb_mottle)"
           transform="rotate(-12 38 17)"/>
  <ellipse cx="27" cy="21" rx="3.2" ry="2" fill="url(#hlb_mottle)"
           transform="rotate(10 27 21)"/>
  <ellipse cx="44" cy="23" rx="2.6" ry="1.7" fill="url(#hlb_mottle)"
           transform="rotate(-20 44 23)"/>
  <ellipse cx="21" cy="15.5" rx="2" ry="1.2" fill="url(#hlb_mottle)"
           transform="rotate(-6 21 15.5)"/>

  <!-- === Citrus fruit with greening near stem === -->
  <circle cx="56" cy="62" r="28" fill="url(#hlb_fruit)"
          stroke="#bf5700" stroke-width="1.4"/>
  <circle cx="56" cy="62" r="28" fill="url(#hlb_fruit_hl)"/>
  <!-- green patch at the stem end (citrus greening symptom) -->
  <path d="M40 42 Q50 30 66 36 Q74 40 76 48 Q66 44 58 46 Q48 48 40 42 Z"
        fill="#7cb342" opacity="0.85"/>
  <path d="M40 42 Q50 30 66 36 Q74 40 76 48" fill="none"
        stroke="#558b2f" stroke-width="1" opacity="0.8"/>
  <!-- peel pores -->
  <g fill="#e65100" opacity="0.35">
    <circle cx="46" cy="66" r="1.3"/>
    <circle cx="58" cy="76" r="1.2"/>
    <circle cx="68" cy="64" r="1.4"/>
    <circle cx="50" cy="80" r="1.1"/>
    <circle cx="70" cy="76" r="1.1"/>
    <circle cx="62" cy="56" r="1.2"/>
    <circle cx="44" cy="54" r="1.1"/>
  </g>
  <!-- navel -->
  <circle cx="56" cy="89.5" r="2" fill="none" stroke="#bf5700"
          stroke-width="1.1" opacity="0.7"/>

  <!-- === Psyllid vector (Diaphorina citri, characteristic tilted pose) === -->
  <g transform="rotate(-35 80 22)">
    <!-- wings folded rooflike -->
    <ellipse cx="80" cy="20" rx="3.4" ry="7" fill="url(#hlb_wing)"
             stroke="#6d4c41" stroke-width="0.7" opacity="0.9"
             transform="rotate(8 80 20)"/>
    <ellipse cx="83" cy="20.5" rx="3" ry="6.4" fill="url(#hlb_wing)"
             stroke="#6d4c41" stroke-width="0.7" opacity="0.8"
             transform="rotate(18 83 20.5)"/>
    <!-- body -->
    <ellipse cx="79" cy="22" rx="2.4" ry="5" fill="url(#hlb_psyllid)"/>
    <!-- head -->
    <circle cx="79" cy="15.5" r="1.8" fill="#5d4037"/>
    <!-- antennae -->
    <path d="M78 14 L75 10" stroke="#4e342e" stroke-width="0.7"
          stroke-linecap="round"/>
    <path d="M80 14 L82 9.5" stroke="#4e342e" stroke-width="0.7"
          stroke-linecap="round"/>
    <!-- legs -->
    <path d="M77.5 24 L74 27" stroke="#4e342e" stroke-width="0.7"
          stroke-linecap="round"/>
    <path d="M80.5 24 L84 27" stroke="#4e342e" stroke-width="0.7"
          stroke-linecap="round"/>
  </g>
</svg>
