<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Main gradient for the spirochete body -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
    
    <!-- Highlight gradient to give a 3D glossy effect -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Shadow / membrane outline -->
  <path d="M 15 80 C 25 45 40 105 55 65 C 70 25 80 85 90 40 C 95 25 90 15 85 10" 
        fill="none" stroke="#4a148c" stroke-width="12" stroke-linecap="round" opacity="0.3" transform="translate(1, 2)"/>
  
  <!-- Main spirochete body (corkscrew shape) -->
  <path d="M 15 80 C 25 45 40 105 55 65 C 70 25 80 85 90 40 C 95 25 90 15 85 10" 
        fill="none" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Inner highlight for 3D effect -->
  <path d="M 15 80 C 25 45 40 105 55 65 C 70 25 80 85 90 40 C 95 25 90 15 85 10" 
        fill="none" stroke="url(#highlight)" stroke-width="4" stroke-linecap="round" transform="translate(-1, -1)"/>

  <!-- Axial filaments (characteristic of spirochetes, wrapping around) -->
  <path d="M 13 78 C 28 50 35 100 55 62 C 75 28 75 80 88 40 C 92 30 85 15 80 12" 
        fill="none" stroke="#8e24aa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Internal nucleoid dots -->
  <circle cx="28" cy="74" r="1.5" fill="#311b92" opacity="0.6"/>
  <circle cx="48" cy="70" r="2" fill="#311b92" opacity="0.6"/>
  <circle cx="68" cy="55" r="1.5" fill="#311b92" opacity="0.6"/>
  <circle cx="85" cy="35" r="1.8" fill="#311b92" opacity="0.6"/>
  <circle cx="36" cy="80" r="1.2" fill="#311b92" opacity="0.6"/>
  <circle cx="75" cy="65" r="1.2" fill="#311b92" opacity="0.6"/>

  <!-- Outer ambient glowing particles (representing antigens or interaction) -->
  <circle cx="20" cy="55" r="1.8" fill="#ba68c8" opacity="0.5"/>
  <circle cx="45" cy="95" r="1.5" fill="#ba68c8" opacity="0.5"/>
  <circle cx="85" cy="70" r="2" fill="#ba68c8" opacity="0.5"/>
  <circle cx="65" cy="20" r="1.5" fill="#ba68c8" opacity="0.5"/>
  <circle cx="95" cy="30" r="1.2" fill="#ba68c8" opacity="0.5"/>
</svg>
