<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="hhv6Chrom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#b3541e"/>
    </linearGradient>
    <radialGradient id="hhv6Virion" cx="40%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
    <radialGradient id="hhv6Glow" cx="42%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#fff3e0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- X-shaped chromosome (two chromatids) -->
  <g stroke="url(#hhv6Chrom)" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="31" y1="17" x2="69" y2="83"/>
    <line x1="69" y1="17" x2="31" y2="83"/>
  </g>

  <!-- Telomere bands (TTAGGG)n near chromatid ends -->
  <g stroke="#7a2e0e" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="29" y1="22" x2="35" y2="15"/>
    <line x1="71" y1="22" x2="65" y2="15"/>
    <line x1="29" y1="78" x2="35" y2="85"/>
    <line x1="71" y1="78" x2="65" y2="85"/>
  </g>

  <!-- Chromatid seam lines (centromere pinch) -->
  <g stroke="#8f3d14" stroke-width="1.6" fill="none" opacity="0.5">
    <line x1="31" y1="17" x2="69" y2="83"/>
    <line x1="69" y1="17" x2="31" y2="83"/>
  </g>

  <!-- Envelope spikes (glycoproteins) -->
  <g stroke="#a93226" stroke-width="2.2" stroke-linecap="round">
    <line x1="50" y1="31" x2="50" y2="25"/>
    <line x1="63" y1="36" x2="67" y2="32"/>
    <line x1="69" y1="50" x2="75" y2="50"/>
    <line x1="63" y1="64" x2="67" y2="68"/>
    <line x1="50" y1="69" x2="50" y2="75"/>
    <line x1="37" y1="64" x2="33" y2="68"/>
    <line x1="31" y1="50" x2="25" y2="50"/>
    <line x1="37" y1="36" x2="33" y2="32"/>
  </g>
  <g fill="#a93226">
    <circle cx="50" cy="24" r="2.2"/>
    <circle cx="68" cy="31" r="2.2"/>
    <circle cx="76" cy="50" r="2.2"/>
    <circle cx="68" cy="69" r="2.2"/>
    <circle cx="50" cy="76" r="2.2"/>
    <circle cx="32" cy="69" r="2.2"/>
    <circle cx="24" cy="50" r="2.2"/>
    <circle cx="32" cy="31" r="2.2"/>
  </g>

  <!-- Viral envelope -->
  <circle cx="50" cy="50" r="19" fill="url(#hhv6Virion)" stroke="#8f2d1d" stroke-width="2"/>
  <circle cx="50" cy="50" r="19" fill="url(#hhv6Glow)"/>

  <!-- Tegument ring -->
  <circle cx="50" cy="50" r="13.5" fill="none" stroke="#7a2e0e" stroke-width="1.4" stroke-dasharray="3 2.4" opacity="0.7"/>

  <!-- Icosahedral capsid -->
  <polygon points="50,40 59,45.5 59,55.5 50,61 41,55.5 41,45.5"
           fill="#f6e0c0" stroke="#7a2e0e" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="none" stroke="#7a2e0e" stroke-width="1" opacity="0.6">
    <line x1="50" y1="40" x2="50" y2="61"/>
    <line x1="41" y1="45.5" x2="59" y2="55.5"/>
    <line x1="59" y1="45.5" x2="41" y2="55.5"/>
  </g>

  <!-- Viral DNA core -->
  <circle cx="50" cy="50" r="2.6" fill="#c0392b"/>
</svg>
