<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="efm_cell" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <radialGradient id="efm_cell2" cx="36%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </radialGradient>
    <radialGradient id="efm_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === Short chain of oval cocci (enterococcus chain), diagonal === -->
  <g transform="rotate(-38 50 42)">
    <ellipse cx="22" cy="42" rx="10" ry="12" fill="url(#efm_cell)" stroke="#bf360c" stroke-width="1.4"/>
    <ellipse cx="22" cy="42" rx="10" ry="12" fill="url(#efm_hl)"/>
    <ellipse cx="41" cy="42" rx="10" ry="12" fill="url(#efm_cell2)" stroke="#bf360c" stroke-width="1.4"/>
    <ellipse cx="41" cy="42" rx="10" ry="12" fill="url(#efm_hl)"/>
    <ellipse cx="60" cy="42" rx="10" ry="12" fill="url(#efm_cell)" stroke="#bf360c" stroke-width="1.4"/>
    <ellipse cx="60" cy="42" rx="10" ry="12" fill="url(#efm_hl)"/>
    <ellipse cx="79" cy="42" rx="10" ry="12" fill="url(#efm_cell2)" stroke="#bf360c" stroke-width="1.4"/>
    <ellipse cx="79" cy="42" rx="10" ry="12" fill="url(#efm_hl)"/>
    <!-- division septa hints between cells -->
    <g stroke="#bf360c" stroke-width="1" stroke-opacity="0.4" fill="none">
      <path d="M31.5 37 V47"/>
      <path d="M50.5 37 V47"/>
      <path d="M69.5 37 V47"/>
    </g>
    <!-- nucleoid dots -->
    <ellipse cx="22" cy="42" rx="4" ry="4.6" fill="#7a2e00" opacity="0.3"/>
    <ellipse cx="41" cy="42" rx="4" ry="4.6" fill="#7a2e00" opacity="0.3"/>
    <ellipse cx="60" cy="42" rx="4" ry="4.6" fill="#7a2e00" opacity="0.3"/>
    <ellipse cx="79" cy="42" rx="4" ry="4.6" fill="#7a2e00" opacity="0.3"/>
  </g>

  <!-- === Diplococcus pair (typical enterococcal arrangement) === -->
  <g transform="rotate(14 31 80)">
    <ellipse cx="24" cy="80" rx="8" ry="9.5" fill="url(#efm_cell2)" stroke="#bf360c" stroke-width="1.2"/>
    <ellipse cx="24" cy="80" rx="8" ry="9.5" fill="url(#efm_hl)"/>
    <ellipse cx="39" cy="80" rx="8" ry="9.5" fill="url(#efm_cell)" stroke="#bf360c" stroke-width="1.2"/>
    <ellipse cx="39" cy="80" rx="8" ry="9.5" fill="url(#efm_hl)"/>
    <ellipse cx="24" cy="80" rx="3.2" ry="3.8" fill="#7a2e00" opacity="0.3"/>
    <ellipse cx="39" cy="80" rx="3.2" ry="3.8" fill="#7a2e00" opacity="0.3"/>
  </g>

  <!-- === Lone coccus === -->
  <g transform="rotate(-15 76 76)">
    <ellipse cx="76" cy="76" rx="9" ry="10.5" fill="url(#efm_cell)" stroke="#bf360c" stroke-width="1.3"/>
    <ellipse cx="76" cy="76" rx="9" ry="10.5" fill="url(#efm_hl)"/>
    <ellipse cx="76" cy="76" rx="3.6" ry="4.2" fill="#7a2e00" opacity="0.3"/>
  </g>

  <!-- === Vancomycin resistance hint: dashed barrier ring === -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#e65100" stroke-width="2"
          stroke-dasharray="7 5" opacity="0.35"/>
</svg>
