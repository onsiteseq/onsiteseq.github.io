<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="mg_body" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </radialGradient>
    <radialGradient id="mg_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#f3e5f5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6a1b9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mg_neck" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </linearGradient>
  </defs>

  <!-- === Flask-shaped body (pear/teardrop), tilted === -->
  <g transform="rotate(-18 50 58)">
    <ellipse cx="50" cy="60" rx="24" ry="30" fill="url(#mg_body)"/>
    <ellipse cx="50" cy="60" rx="24" ry="30" fill="url(#mg_hl)"/>
    <ellipse cx="50" cy="60" rx="24" ry="30" fill="none" stroke="#4a148c"
             stroke-width="1.6" opacity="0.7"/>

    <!-- Narrowing neck to the tip organelle -->
    <path d="M42 34 Q46 24 50 20 Q54 24 58 34 Q54 31 50 31 Q46 31 42 34 Z"
          fill="url(#mg_neck)" stroke="#4a148c" stroke-width="1.2" opacity="0.95"/>

    <!-- Tip organelle (attachment structure / "nap") -->
    <ellipse cx="50" cy="17" rx="5" ry="7" fill="#4a148c" opacity="0.9"/>
    <ellipse cx="50" cy="13" rx="3" ry="3.5" fill="#38006b" opacity="0.9"/>
    <line x1="50" y1="10" x2="50" y2="5" stroke="#38006b" stroke-width="1.6"
          stroke-linecap="round"/>

    <!-- Ribosome dots inside the cell -->
    <circle cx="42" cy="52" r="2.2" fill="#38006b" opacity="0.35"/>
    <circle cx="56" cy="50" r="2" fill="#38006b" opacity="0.3"/>
    <circle cx="48" cy="62" r="2.4" fill="#38006b" opacity="0.35"/>
    <circle cx="58" cy="66" r="2" fill="#38006b" opacity="0.3"/>
    <circle cx="44" cy="72" r="2.2" fill="#38006b" opacity="0.35"/>
    <circle cx="53" cy="78" r="1.8" fill="#38006b" opacity="0.3"/>
    <circle cx="50" cy="44" r="1.8" fill="#38006b" opacity="0.3"/>
  </g>

  <!-- Surface proteins (short stubs around the membrane) -->
  <line x1="26" y1="40" x2="18" y2="34" stroke="#8e24aa" stroke-width="1.4"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="58" x2="13" y2="56" stroke="#8e24aa" stroke-width="1.4"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="27" y1="76" x2="20" y2="82" stroke="#8e24aa" stroke-width="1.4"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="70" y1="30" x2="77" y2="24" stroke="#8e24aa" stroke-width="1.4"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="77" y1="52" x2="86" y2="50" stroke="#8e24aa" stroke-width="1.4"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="72" y1="74" x2="79" y2="80" stroke="#8e24aa" stroke-width="1.4"
        stroke-linecap="round" opacity="0.8"/>

  <!-- Dividing cell nearby (binary fission hint) -->
  <g transform="rotate(20 82 84)" opacity="0.75">
    <ellipse cx="82" cy="84" rx="9" ry="11" fill="url(#mg_body)"/>
    <ellipse cx="82" cy="84" rx="9" ry="11" fill="url(#mg_hl)"/>
    <ellipse cx="82" cy="84" rx="9" ry="11" fill="none" stroke="#4a148c"
             stroke-width="1.2" opacity="0.7"/>
  </g>
</svg>
