<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="hvkp_halo" cx="50%" cy="50%" r="60%">
      <stop offset="55%" stop-color="#b2dfdb" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#4db6ac" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00695c" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="hvkp_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00796b"/>
    </linearGradient>
    <radialGradient id="hvkp_hl" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e0f2f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00796b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === Mucoid hypercapsule "halo" (string-test phenotype) === -->
  <ellipse cx="50" cy="52" rx="44" ry="34" fill="url(#hvkp_halo)"/>
  <ellipse cx="50" cy="52" rx="44" ry="34" fill="none" stroke="#004d40" stroke-width="1.4" stroke-opacity="0.55" stroke-dasharray="4 3"/>

  <!-- === Rod-shaped cell (bacillus) === -->
  <g transform="rotate(-18 50 52)">
    <rect x="22" y="43" width="56" height="18" rx="9" fill="url(#hvkp_body)" stroke="#004d40" stroke-width="1.8"/>
    <rect x="22" y="43" width="56" height="18" rx="9" fill="url(#hvkp_hl)"/>

    <!-- Nucleoid (bacterial chromosome) -->
    <path d="M30 52 Q36 47 42 52 T54 52 T66 52" stroke="#e0f2f1" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M33 56 Q39 53 45 56 T57 56" stroke="#e0f2f1" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-opacity="0.6"/>

    <!-- pLVPK virulence plasmid inside the cell -->
    <circle cx="68" cy="55" r="3.4" fill="none" stroke="#fff3e0" stroke-width="1.5"/>
    <circle cx="68" cy="55" r="1" fill="#fff3e0"/>
  </g>

  <!-- === Pili / fimbriae === -->
  <g stroke="#004d40" stroke-width="1.4" stroke-linecap="round" fill="none" stroke-opacity="0.8">
    <path d="M24 42 Q19 38 16 40"/>
    <path d="M30 38 Q27 33 23 33"/>
    <path d="M74 66 Q79 70 83 68"/>
    <path d="M68 70 Q71 75 76 75"/>
    <path d="M20 55 Q14 56 12 60"/>
  </g>

  <!-- === Plasmid copy outside the cell (conjugative spread) === -->
  <circle cx="83" cy="26" r="4" fill="none" stroke="#00695c" stroke-width="1.6"/>
  <circle cx="83" cy="26" r="1.1" fill="#00695c"/>
</svg>
