<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="pd_sp" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#607d8b"/>
    </radialGradient>
    <radialGradient id="pd_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#607d8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pd_stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
  </defs>

  <!-- === Dichotomously branching tree-like sporangiophore === -->
  <path d="M50 96 Q50 78 50 62" stroke="url(#pd_stem)" stroke-width="3.2"
        stroke-linecap="round" fill="none"/>

  <!-- Level 1 -->
  <path d="M50 74 Q38 66 30 56" stroke="#78909c" stroke-width="2.4"
        stroke-linecap="round" fill="none"/>
  <path d="M50 74 Q62 66 70 56" stroke="#78909c" stroke-width="2.4"
        stroke-linecap="round" fill="none"/>
  <!-- Centre branch -->
  <path d="M50 62 Q50 52 50 44" stroke="#78909c" stroke-width="2.2"
        stroke-linecap="round" fill="none"/>

  <!-- Level 2 -->
  <path d="M30 56 Q24 48 20 40" stroke="#90a4ae" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M30 56 Q34 48 36 40" stroke="#90a4ae" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M70 56 Q66 48 64 40" stroke="#90a4ae" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>
  <path d="M70 56 Q76 48 80 40" stroke="#90a4ae" stroke-width="1.8"
        stroke-linecap="round" fill="none"/>

  <!-- Sharp pointed tips (sterigmata) -->
  <path d="M20 40 L14 30" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M20 40 L22 29" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 40 L30 30" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 40 L39 29" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M50 44 L44 34" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M50 44 L56 34" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M64 40 L61 29" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M64 40 L70 30" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M80 40 L78 29" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M80 40 L86 30" stroke="#455a64" stroke-width="1.4" stroke-linecap="round"/>

  <!-- === Sporangia borne on the tips === -->
  <ellipse cx="13" cy="26" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9" transform="rotate(-15 13 26)"/>
  <ellipse cx="23" cy="25" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9"/>
  <ellipse cx="29" cy="26" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9" transform="rotate(-10 29 26)"/>
  <ellipse cx="40" cy="25" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9"/>
  <ellipse cx="43" cy="30" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9" transform="rotate(-15 43 30)"/>
  <ellipse cx="57" cy="30" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9" transform="rotate(15 57 30)"/>
  <ellipse cx="60" cy="25" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9"/>
  <ellipse cx="71" cy="26" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9" transform="rotate(10 71 26)"/>
  <ellipse cx="77" cy="25" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9"/>
  <ellipse cx="87" cy="26" rx="3" ry="4.5" fill="url(#pd_sp)" stroke="#455a64" stroke-width="0.9" transform="rotate(15 87 26)"/>

  <!-- Highlights on a few sporangia -->
  <ellipse cx="23" cy="25" rx="3" ry="4.5" fill="url(#pd_hl)"/>
  <ellipse cx="60" cy="25" rx="3" ry="4.5" fill="url(#pd_hl)"/>
  <ellipse cx="40" cy="25" rx="3" ry="4.5" fill="url(#pd_hl)"/>

  <!-- === Detached sporangia === -->
  <circle cx="38" cy="86" r="2.8" fill="url(#pd_sp)" opacity="0.6"/>
  <circle cx="62" cy="86" r="2.8" fill="url(#pd_sp)" opacity="0.6"/>
  <circle cx="50" cy="90" r="2.3" fill="url(#pd_sp)" opacity="0.5"/>
</svg>
