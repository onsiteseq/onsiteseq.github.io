<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="crn_capsule" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#eceff1" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#b0bec5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78909c" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="crn_cell" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#37474f"/>
    </radialGradient>
    <radialGradient id="crn_bud" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </radialGradient>
    <radialGradient id="crn_nucleus" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#78909c"/>
    </radialGradient>
    <radialGradient id="crn_hl" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#37474f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- === Huge polysaccharide capsule (signature halo) === -->
  <g>
    <!-- halo around mother cell and bud -->
    <ellipse cx="50" cy="52" rx="40" ry="38" fill="url(#crn_capsule)" stroke="#90a4ae" stroke-width="1.4" stroke-opacity="0.8"/>
    <ellipse cx="72" cy="26" rx="17" ry="16" fill="url(#crn_capsule)" stroke="#90a4ae" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- capsule radial fibrils -->
    <g stroke="#78909c" stroke-width="0.8" stroke-opacity="0.55" fill="none">
      <path d="M50 14 L50 24"/>
      <path d="M22 34 L29 40"/>
      <path d="M12 58 L23 58"/>
      <path d="M30 82 L36 74"/>
      <path d="M70 84 L65 75"/>
      <path d="M88 62 L78 59"/>
      <path d="M84 14 L79 21"/>
      <path d="M62 10 L61 18"/>
    </g>
  </g>

  <!-- === Mother yeast cell === -->
  <g>
    <circle cx="50" cy="55" r="17" fill="url(#crn_cell)" stroke="#263238" stroke-width="1.8"/>
    <!-- nucleus -->
    <ellipse cx="46" cy="57" rx="6" ry="5" fill="url(#crn_nucleus)" stroke="#455a64" stroke-width="1.1"/>
    <!-- glossy highlight -->
    <ellipse cx="43" cy="47" rx="8" ry="4" transform="rotate(-20 43 47)" fill="url(#crn_hl)"/>
  </g>

  <!-- === Budding daughter cell with narrow neck === -->
  <g>
    <!-- narrow bud neck -->
    <path d="M62 44 L66 36 L70 37 L66 45 Z" fill="url(#crn_bud)" stroke="#263238" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- daughter cell -->
    <circle cx="72" cy="28" r="9.5" fill="url(#crn_bud)" stroke="#263238" stroke-width="1.6"/>
    <!-- bud highlight -->
    <ellipse cx="69" cy="24" rx="4" ry="2" transform="rotate(-25 69 24)" fill="url(#crn_hl)"/>
  </g>
</svg>
