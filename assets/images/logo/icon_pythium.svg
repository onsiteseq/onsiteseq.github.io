<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="py_spg" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#00838f"/>
    </radialGradient>
    <radialGradient id="py_hl" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00838f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="py_ves" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </radialGradient>
    <linearGradient id="py_tube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00acc1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>

  <!-- === Round sporangium === -->
  <circle cx="34" cy="62" r="19" fill="url(#py_spg)"/>
  <circle cx="34" cy="62" r="19" fill="url(#py_hl)"/>
  <circle cx="34" cy="62" r="19" fill="none" stroke="#006064" stroke-width="1.8" opacity="0.7"/>
  <!-- Inner structure -->
  <ellipse cx="30" cy="58" rx="7" ry="6" fill="#006064" opacity="0.3"/>

  <!-- === Discharge tube === -->
  <path d="M50 52 Q62 45 70 40" stroke="url(#py_tube)" stroke-width="3.2"
        stroke-linecap="round" fill="none"/>

  <!-- === Vesicle with zoospores differentiating inside === -->
  <circle cx="79" cy="34" r="11" fill="url(#py_ves)" opacity="0.9"/>
  <circle cx="79" cy="34" r="11" fill="none" stroke="#00838f" stroke-width="1.4"
          stroke-dasharray="3 2" opacity="0.8"/>
  <circle cx="75" cy="31" r="1.8" fill="#006064" opacity="0.6"/>
  <circle cx="82" cy="32" r="1.8" fill="#006064" opacity="0.6"/>
  <circle cx="78" cy="38" r="1.8" fill="#006064" opacity="0.6"/>
  <circle cx="84" cy="38" r="1.5" fill="#006064" opacity="0.5"/>

  <!-- === Released biflagellate zoospores === -->
  <circle cx="92" cy="22" r="2.6" fill="#4dd0e1" stroke="#00838f" stroke-width="0.8" opacity="0.9"/>
  <path d="M94 20 L97 16" stroke="#00838f" stroke-width="0.8" opacity="0.7"/>
  <path d="M94.5 21.5 L98 19" stroke="#00838f" stroke-width="0.8" opacity="0.7"/>
  <circle cx="92" cy="44" r="2.6" fill="#4dd0e1" stroke="#00838f" stroke-width="0.8" opacity="0.9"/>
  <path d="M94 46 L97 50" stroke="#00838f" stroke-width="0.8" opacity="0.7"/>
  <path d="M93 47 L94.5 51" stroke="#00838f" stroke-width="0.8" opacity="0.7"/>
  <circle cx="66" cy="18" r="2.4" fill="#4dd0e1" stroke="#00838f" stroke-width="0.8" opacity="0.85"/>
  <path d="M64 16 L61 12" stroke="#00838f" stroke-width="0.8" opacity="0.7"/>
  <circle cx="58" cy="28" r="2.2" fill="#80deea" stroke="#00838f" stroke-width="0.7" opacity="0.8"/>
  <path d="M56.5 26.5 L53 24" stroke="#00838f" stroke-width="0.8" opacity="0.7"/>

  <!-- === Oospore in substrate (bottom left) === -->
  <circle cx="18" cy="86" r="7" fill="none" stroke="#006064" stroke-width="1.5" opacity="0.7"/>
  <circle cx="18" cy="86" r="5.2" fill="url(#py_spg)" opacity="0.8"/>
</svg>
