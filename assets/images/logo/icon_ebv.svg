<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="ebvEnvelope" cx="40%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#5c6bc0"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
    <radialGradient id="ebvCapsid" cx="42%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#9fa8da"/>
      <stop offset="100%" stop-color="#3949ab"/>
    </radialGradient>
    <radialGradient id="ebvCell" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#9fa8da"/>
    </radialGradient>
    <radialGradient id="ebvNucleus" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#7986cb"/>
      <stop offset="100%" stop-color="#283593"/>
    </radialGradient>
  </defs>

  <!-- Outer halo -->
  <circle cx="46" cy="46" r="44" fill="none" stroke="#3949ab" stroke-width="2" stroke-dasharray="4 3" opacity="0.35"/>

  <!-- B-lymphocyte (background, bottom-right) -->
  <circle cx="68" cy="70" r="24" fill="url(#ebvCell)" stroke="#3949ab" stroke-width="2"/>
  <circle cx="68" cy="70" r="15" fill="url(#ebvNucleus)" stroke="#1a237e" stroke-width="1.6"/>
  <!-- chromatin speckles -->
  <g fill="#c5cae9" opacity="0.85">
    <circle cx="63" cy="66" r="1.8"/>
    <circle cx="72" cy="64" r="1.4"/>
    <circle cx="74" cy="73" r="1.8"/>
    <circle cx="64" cy="75" r="1.4"/>
  </g>
  <!-- B-cell surface receptors (BCR, Y-shapes) -->
  <g stroke="#3949ab" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M68 44 v-5 M65 36 l3 3 3-3"/>
    <path d="M88 58 l4-4 M92 50 l-1 4 4 1"/>
    <path d="M88 82 l4 4 M92 90 l-1-4 4-1"/>
    <path d="M48 82 l-4 4 M44 90 l1-4 -4-1"/>
  </g>

  <!-- Herpesvirion envelope spikes -->
  <g stroke="#1a237e" stroke-width="1.8" stroke-linecap="round">
    <line x1="38" y1="12" x2="38" y2="6"/>
    <line x1="60" y1="16" x2="65" y2="11"/>
    <line x1="70" y1="30" x2="77" y2="27"/>
    <line x1="12" y1="30" x2="5"  y2="27"/>
    <line x1="16" y1="16" x2="11" y2="11"/>
    <line x1="8"  y1="48" x2="2"  y2="48"/>
    <line x1="12" y1="66" x2="5"  y2="69"/>
    <line x1="22" y1="80" x2="17" y2="86"/>
  </g>
  <g fill="#7986cb" stroke="#1a237e" stroke-width="1.2">
    <circle cx="38" cy="6"  r="2.4"/>
    <circle cx="65" cy="11" r="2.4"/>
    <circle cx="77" cy="27" r="2.4"/>
    <circle cx="5"  cy="27" r="2.4"/>
    <circle cx="11" cy="11" r="2.4"/>
    <circle cx="2"  cy="48" r="2.4"/>
    <circle cx="5"  cy="69" r="2.4"/>
    <circle cx="17" cy="86" r="2.4"/>
  </g>

  <!-- Virion envelope -->
  <circle cx="38" cy="46" r="28" fill="url(#ebvEnvelope)" stroke="#1a237e" stroke-width="2"/>
  <!-- envelope membrane hint -->
  <circle cx="38" cy="46" r="23.5" fill="none" stroke="#c5cae9" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>

  <!-- Icosahedral capsid -->
  <polygon points="38,29 53,37.5 53,54.5 38,63 23,54.5 23,37.5"
           fill="url(#ebvCapsid)" stroke="#1a237e" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="none" stroke="#1a237e" stroke-width="1" opacity="0.5" stroke-linejoin="round">
    <path d="M38,29 38,46 23,37.5"/>
    <path d="M38,29 38,46 53,37.5"/>
    <path d="M38,63 38,46 23,54.5"/>
    <path d="M38,63 38,46 53,54.5"/>
  </g>

  <!-- dsDNA genome squiggle inside capsid -->
  <path d="M31,43 q3,-4 6,0 t6,0" fill="none" stroke="#e8eaf6" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M31,49 q3,-4 6,0 t6,0" fill="none" stroke="#e8eaf6" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
</svg>
