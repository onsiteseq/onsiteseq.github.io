<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="flu_body" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#7986cb"/>
      <stop offset="100%" stop-color="#283593"/>
    </radialGradient>
    <radialGradient id="flu_hl" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#e8eaf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#283593" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ha_grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9fa8da"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
    <radialGradient id="na_grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#00695c"/>
    </radialGradient>
  </defs>

  <!-- === HA spikes (hemagglutinin) — triangular/rod shape === -->
  <!-- Top -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"/>
  <!-- Top-right -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(45 50 50)"/>
  <!-- Right -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(90 50 50)"/>
  <!-- Bottom-right -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(135 50 50)"/>
  <!-- Bottom -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(180 50 50)"/>
  <!-- Bottom-left -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(225 50 50)"/>
  <!-- Left -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(270 50 50)"/>
  <!-- Top-left -->
  <rect x="47.5" y="10" width="5" height="12" rx="2.5" fill="url(#ha_grad)"
        transform="rotate(315 50 50)"/>

  <!-- === NA spikes (neuraminidase) — mushroom shape (stalk + head) === -->
  <!-- Between HA at 22.5° -->
  <line x1="50" y1="26" x2="50" y2="16" stroke="#00796b" stroke-width="2"
        transform="rotate(22.5 50 50)" stroke-linecap="round"/>
  <circle cx="50" cy="13" r="4" fill="url(#na_grad)"
        transform="rotate(22.5 50 50)"/>
  <!-- 67.5° -->
  <line x1="50" y1="26" x2="50" y2="16" stroke="#00796b" stroke-width="2"
        transform="rotate(67.5 50 50)" stroke-linecap="round"/>
  <circle cx="50" cy="13" r="4" fill="url(#na_grad)"
        transform="rotate(67.5 50 50)"/>
  <!-- 157.5° -->
  <line x1="50" y1="26" x2="50" y2="16" stroke="#00796b" stroke-width="2"
        transform="rotate(157.5 50 50)" stroke-linecap="round"/>
  <circle cx="50" cy="13" r="4" fill="url(#na_grad)"
        transform="rotate(157.5 50 50)"/>
  <!-- 247.5° -->
  <line x1="50" y1="26" x2="50" y2="16" stroke="#00796b" stroke-width="2"
        transform="rotate(247.5 50 50)" stroke-linecap="round"/>
  <circle cx="50" cy="13" r="4" fill="url(#na_grad)"
        transform="rotate(247.5 50 50)"/>

  <!-- === Viral body === -->
  <circle cx="50" cy="50" r="20" fill="url(#flu_body)"/>
  <circle cx="50" cy="50" r="20" fill="url(#flu_hl)"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#1a237e" stroke-width="1.5" opacity="0.5"/>

  <!-- === RNA segments (8 segments of influenza) inside === -->
  <ellipse cx="46" cy="47" rx="4" ry="7" fill="#1a237e" opacity="0.2" transform="rotate(-20 46 47)"/>
  <ellipse cx="54" cy="47" rx="4" ry="7" fill="#1a237e" opacity="0.2" transform="rotate(20 54 47)"/>
  <ellipse cx="50" cy="53" rx="3" ry="5" fill="#1a237e" opacity="0.2"/>
  <ellipse cx="43" cy="54" rx="3" ry="4" fill="#1a237e" opacity="0.2" transform="rotate(30 43 54)"/>
  <ellipse cx="57" cy="54" rx="3" ry="4" fill="#1a237e" opacity="0.2" transform="rotate(-30 57 54)"/>
</svg>
