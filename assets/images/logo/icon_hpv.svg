<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="hpvBody" cx="42%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#c792ea"/>
      <stop offset="100%" stop-color="#6b5ce7"/>
    </radialGradient>
    <radialGradient id="hpvGlow" cx="42%" cy="34%" r="60%">
      <stop offset="0%" stop-color="#f3e9ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6b5ce7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Capsid outer halo -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#6b5ce7" stroke-width="2" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Icosahedral capsid body -->
  <polygon points="50,12 82,32 82,68 50,88 18,68 18,32"
           fill="url(#hpvBody)" stroke="#4b3bc0" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="50,12 82,32 82,68 50,88 18,68 18,32" fill="url(#hpvGlow)"/>

  <!-- Capsomere facet lines (T=7 icosahedral feel) -->
  <g fill="none" stroke="#4b3bc0" stroke-width="1.4" opacity="0.55" stroke-linejoin="round">
    <polygon points="50,12 50,38 28,50 18,32"/>
    <polygon points="50,12 50,38 72,50 82,32"/>
    <polygon points="50,88 50,62 28,50 18,68"/>
    <polygon points="50,88 50,62 72,50 82,68"/>
    <polygon points="50,38 72,50 50,62 28,50"/>
  </g>

  <!-- Capsomere pentons -->
  <g fill="#f3e9ff" opacity="0.9">
    <circle cx="50" cy="12" r="3"/>
    <circle cx="82" cy="32" r="3"/>
    <circle cx="82" cy="68" r="3"/>
    <circle cx="50" cy="88" r="3"/>
    <circle cx="18" cy="68" r="3"/>
    <circle cx="18" cy="32" r="3"/>
    <circle cx="50" cy="50" r="3.4"/>
  </g>
</svg>
