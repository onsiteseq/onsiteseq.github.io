<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="spy_coccus" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffcdd2"/>
      <stop offset="55%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <radialGradient id="spy_coccus_dim" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f8bbd0"/>
      <stop offset="55%" stop-color="#ec407a"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </radialGradient>
    <radialGradient id="spy_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef9a9a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ef9a9a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft background halo (beta-hemolysis hint) -->
  <circle cx="50" cy="50" r="44" fill="url(#spy_halo)"/>

  <!-- === Streptococcus chains (strep-to = chains) === -->
  <!-- chain 1: long diagonal, upper-left to lower-right -->
  <g stroke="#7f0000" stroke-width="1.5" fill="url(#spy_coccus)">
    <circle cx="24" cy="18" r="7"/>
    <circle cx="32" cy="30" r="7"/>
    <circle cx="40" cy="42" r="7"/>
    <circle cx="48" cy="54" r="7"/>
    <circle cx="56" cy="66" r="7"/>
    <circle cx="64" cy="78" r="7"/>
  </g>

  <!-- chain 2: shorter, offset right -->
  <g stroke="#7f0000" stroke-width="1.5" fill="url(#spy_coccus)">
    <circle cx="58" cy="16" r="6"/>
    <circle cx="66" cy="27" r="6"/>
    <circle cx="74" cy="38" r="6"/>
    <circle cx="82" cy="49" r="6"/>
  </g>

  <!-- chain 3: short, lower-left, dimmer hue -->
  <g stroke="#6a0030" stroke-width="1.5" fill="url(#spy_coccus_dim)">
    <circle cx="16" cy="60" r="6"/>
    <circle cx="24" cy="71" r="6"/>
    <circle cx="32" cy="82" r="6"/>
  </g>

  <!-- glossy highlights on cocci -->
  <g fill="#ffffff" fill-opacity="0.8">
    <circle cx="21.5" cy="15.5" r="1.8"/>
    <circle cx="29.5" cy="27.5" r="1.8"/>
    <circle cx="37.5" cy="39.5" r="1.8"/>
    <circle cx="45.5" cy="51.5" r="1.8"/>
    <circle cx="53.5" cy="63.5" r="1.8"/>
    <circle cx="61.5" cy="75.5" r="1.8"/>
    <circle cx="56" cy="14" r="1.5"/>
    <circle cx="64" cy="25" r="1.5"/>
    <circle cx="72" cy="36" r="1.5"/>
    <circle cx="80" cy="47" r="1.5"/>
    <circle cx="14" cy="58" r="1.4"/>
    <circle cx="22" cy="69" r="1.4"/>
    <circle cx="30" cy="80" r="1.4"/>
  </g>

  <!-- chain bonds (division-plane hints) -->
  <g stroke="#7f0000" stroke-width="1" stroke-opacity="0.5" fill="none">
    <path d="M27 23 L29 25"/>
    <path d="M35 35 L37 37"/>
    <path d="M43 47 L45 49"/>
    <path d="M51 59 L53 61"/>
    <path d="M59 71 L61 73"/>
    <path d="M61 20 L63 22"/>
    <path d="M69 31 L71 33"/>
    <path d="M77 42 L79 44"/>
  </g>
</svg>
