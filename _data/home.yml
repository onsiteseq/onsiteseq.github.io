navbar_entries:
  - title: О платформе
    url: aboutonsiteseq

  - title: Контакты
    url: contact

  - title: Вход в Облако
    url: https://cloud.onsiteseq.io

component_entries:
  - title: OnSiteSeq Edge
    url: edge
    desc: Автономный программно-аппаратный комплекс. Секвенирование у кровати пациента, в регионах крайнего севера и на выезде. Архитектура arm64, GPU Nvidia Jetson AGX.
    image: /assets/images/logo/icon_edge.svg

  - title: OnSiteSeq Desktop
    url: desktop
    desc: Система управления пайплайнами Cockpit для рабочего компьютера врача или исследователя. Работает автономно или в паре с Edge. Архитектура x86.
    image: /assets/images/logo/icon_desktop.svg

  - title: OnSiteSeq Cloud
    url: cloud
    desc: Версия Cockpit для запуска в облачных провайдерах. Доступна по адресу cloud.onsiteseq.io. Архитектура x86.
    image: /assets/images/logo/icon_cloud.svg

project_entries:
  - title: ВИЧ
    url: hiv
    desc: Определение лекарственной устойчивости и субтипа ВИЧ-1
    image: /assets/images/logo/hiv_white.png

  - title: Туберкулёз
    url: tuberculosis
    desc: Определение лекарственной устойчивости и линий Mycobacterium tuberculosis
    image: /assets/images/logo/tub.png

oncology_entries:
  - title: Вирус папилломы человека (ВПЧ)
    url: hpv
    desc: Генотипирование ВПЧ высокого риска, определение статуса интеграции в геном и метилирование-триаж для профилактики рака шейки матки — от главной причины к ключевому элементу профилактики
    image: /assets/images/logo/icon_hpv.svg

old_project_entries:
  - title: Сифилис
    url: syphilis
    desc: Определение макролидной резистентности и генотипирование Treponema pallidum
    image: /assets/images/logo/icon_syphilis.svg

  - title: Acinetobacter baumannii (CRAB)
    url: acinetobacter
    desc: Полный профиль AMR и детекция карбапенемаз (OXA-23, NDM, VIM) — приоритетный патоген ВОЗ категории «критический», главная угроза ОРИТ
    image: /assets/images/logo/acinetobacter.png

  - title: Pseudomonas aeruginosa (CRPA)
    url: pseudomonas
    desc: Полный AMR-профиль, детекция МБЛ (VIM, NDM) и насосов эффлюкса (MexAB) — мастер адаптации, ключевой патоген ОРИТ и муковисцидоза
    image: /assets/images/logo/pseudomonas.png

  - title: Хламидиоз (C. trachomatis)
    url: chlamydia
    desc: Генотипирование сероваров (A–L) и определение резистентности к макролидам и фторхинолонам — самая распространённая бактериальная ИППП в мире
    image: /assets/images/logo/chlamydia.png

  - title: Микоплазмоз (M. genitalium)
    url: mycoplasma
    desc: Диагностика резистентности Mycoplasma genitalium к макролидам и фторхинолонам перед терапией — быстро развивающаяся МЛУ, часто пропускаемый возбудитель ИППП
    image: /assets/images/logo/icon_mycoplasma.svg

  - title: Гепатит B (HBV)
    url: hbv
    desc: Генотипирование HBV (A–J), мутации резистентности в полимеразе (YMDD), HBeAg-статус и маркеры риска рака печени — из одного анализа
    image: /assets/images/logo/icon_hbv.svg

  - title: Гипервирулентная клебсиелла (hvKP)
    url: hvkp
    desc: Маркеры вирулентности (rmpA, iucA, peg-344), капсульные типы K1/K2 и конвергенция с карбапенем-резистентностью — абсцесс печени и метастатические инфекции
    image: /assets/images/logo/icon_hvkp.svg

  - title: СТЛТ (SFTS, Dabie bandavirus)
    url: sfts
    desc: Point-of-care mNGS вируса тяжёлой лихорадки с тромбоцитопенией — сегментный анализ L/M/S и дифференциация геморрагических лихорадок в эндемичных районах
    image: /assets/images/logo/icon_sfts.svg

  - title: Талассемия (HBA/HBB)
    url: thalassemia
    desc: "Один тест вместо gap-PCR + MLPA + Sanger: делеции α-кластера, мутации HBB и фазирование cis/trans на длинных прочтениях — скрининг пар и пренатальная диагностика"
    image: /assets/images/logo/icon_thalassemia.svg

  - title: Коронавирус SARS-COV-2
    url: sarscov2
    desc: Определение варианта (субтипа) и устойчивости к противовирусным препаратам
    image: /assets/images/logo/icon_sarscov2.svg

  - title: ОРВИ (вирусные возбудители)
    url: flu
    desc: Метагеномная идентификация вирусных возбудителей ОРВИ — грипп A/B, RSV, риновирус, коронавирусы, аденовирус и др.
    image: /assets/images/logo/icon_flu.svg

  - title: ОРЗ (бактериальные возбудители)
    url: cold
    desc: Метагеномная идентификация бактериальных возбудителей ОРЗ и их устойчивости к антибиотикам — S. pneumoniae, H. influenzae, K. pneumoniae и др.
    image: /assets/images/logo/icon_cold.svg

  - title: Палочка Пфайфера (H. influenzae)
    url: haemophilus
    desc: "BLNAR через мутации ftsI (PBP3), которую не видит ПЦР на β-лактамазу, серотипирование a–f/NTHi и дифференциация от H. haemolyticus — отит, ХОБЛ, эпиглоттит"
    image: /assets/images/logo/icon_haemophilus.svg

  - title: Микробиом кишечника
    url: microbiome
    desc: "По следам HMP и MetaHIT: full-length 16S до вида, профиль до/после FMT при рецидиве C. difficile, резистом ОРИТ — энтеротипы и функции вместо списка родов"
    image: /assets/images/logo/icon_microbiome.svg

  - title: Вагинальный микробиом
    url: vaginal
    desc: "CST-типирование и L. crispatus vs L. iners на полноразмерном 16S — предиктор преждевременных родов и рецидивов бактериального вагиноза"
    image: /assets/images/logo/icon_vaginal.svg

  - title: Малярия
    url: plasmodium
    desc: Профиль устойчивости P. falciparum (артемизинин, ACT-партнёры), видовая идентификация и делеции hrp2/hrp3 — верификация завозных случаев
    image: /assets/images/logo/icon_plasmodium.png

  - title: Грипп
    url: influenza
    desc: Субтипирование, реассортация сегментов (антигенный сдвиг) и устойчивость к противовирусным — мониторинг штаммов гриппа
    image: /assets/images/logo/icon_influenza.png

  - title: Helicobacter pylori
    url: helicobacter
    desc: Профиль устойчивости и вирулентности (cagA/vacA) H. pylori из биоптата за день — для подбора индивидуальной эрадикационной терапии
    image: /assets/images/logo/icon_helicobacter.png

clostridia_entries:
  - title: Клостридии (C. difficile)
    url: cdifficile
    desc: Определение лекарственной устойчивости и токсигенности Clostridioides difficile — возбудитель антибиотик-ассоциированного колита
    image: /assets/images/logo/icon_cdifficile.svg

  - title: Газовая гангрена (C. perfringens)
    url: perfringens
    desc: "Токсинотипирование (cpa/cpb/etx/cpe/netB) и AMR-профиль Clostridium perfringens за часы — при мионекрозе счёт идёт на часы: ~15 см/час, летальность без лечения до 100%"
    image: /assets/images/logo/icon_perfringens.svg

  - title: Ботулизм (C. botulinum)
    url: botulinum
    desc: Детекция bont A–G и серотипирование за часы — самый сильный яд из известных; антитоксин эффективен только при раннем введении
    image: /assets/images/logo/icon_botulinum.svg

  - title: Токсический шок (P. sordellii и C. septicum)
    url: sordellii
    desc: Шок без лихорадки после родов и спонтанная гангрена — маркер скрытого рака — детекция tcsL/tcsH и csa из крови и ткани за часы
    image: /assets/images/logo/icon_sordellii.svg

  - title: Онколитик C. novyi-NT
    url: novyi
    desc: Онколитические клостридии — геномный QC штамма и мониторинг прорастания спор в гипоксичном ядре опухоли
    image: /assets/images/logo/icon_novyi.svg

  - title: Эмкар КРС (C. chauvoei)
    url: chauvoei
    desc: Эмфизематозный карбункул — полевая дифференциация от сибирской язвы, детекция cctA, молекулярная эпидемиология вспышек
    image: /assets/images/logo/icon_chauvoei.svg

candida_entries:
  - title: Candida albicans
    url: albicans
    desc: Азольная (ERG11, TAC1, эффлюкс) и эхинокандиновая (FKS1) резистентность + анеуплоидии (изохромосома 5L) — SNV, CNV и структурные варианты в одном запуске на длинных прочтениях
    image: /assets/images/logo/icon_albicans.svg

  - title: Супергриб Candida auris
    url: auris
    desc: Молекулярная идентификация (фенотип ошибается), определение клады I–VI, MDR-профиль и отслеживание внутрибольничных вспышек по SNP
    image: /assets/images/logo/icon_auris.svg

  - title: Candida glabrata (Nakaseomyces)
    url: glabrata
    desc: Эволюция резистентности во время терапии — PDR1, горячие точки FKS1/FKS2, мутаторный фенотип MSH2; мониторинг серийных изолятов
    image: /assets/images/logo/icon_glabrata.svg

  - title: Candida parapsilosis
    url: parapsilosis
    desc: Вспышки в неонатальных ОРИТ и катетер-ассоциированная кандидемия — детекция ERG11 Y132F и SNP-трассировка источника (руки персонала, оборудование)
    image: /assets/images/logo/icon_parapsilosis.svg

  - title: Candida tropicalis и C. krusei
    url: tropicalis
    desc: Азиатские азоль-резистентные клоны tropicalis (ERG11 Y132F/A395T) и врождённая флуконазол-резистентность krusei — видовая идентификация решает стартовую терапию
    image: /assets/images/logo/icon_tropicalis.svg

  - title: Malassezia (липофильные дрожжи)
    url: malassezia
    desc: "Фунгемии NICU у детей на липидных эмульсиях, зоонозные вспышки M. pachydermatis с собак — культура мучительна (агар Dixon), молекулярная идентификация и SNP-трассировка решают"
    image: /assets/images/logo/icon_malassezia.svg

  - title: Cryptococcus neoformans / gattii
    url: cryptococcus
    desc: "Криптококковый менингит — до 19% ВИЧ-смертности: видовая дифференциация neoformans/gattii, типы VNI–VNIV/VGI–VGIV и азольная гетерорезистентность через дисомию хромосомы 1"
    image: /assets/images/logo/icon_cryptococcus.svg

cocci_entries:
  - title: Золотистый стафилококк (S. aureus)
    url: staphylococcus
    desc: Определение MRSA/VRSA и полного профиля AMR Staphylococcus aureus — ведущего возбудителя нозокомиальных инфекций
    image: /assets/images/logo/icon_staphylococcus.svg

  - title: Пневмококк (S. pneumoniae)
    url: pneumoniae
    desc: "Мозаичные pbp2x/pbp2b/pbp1a и серотипирование по cps-локусу: вакцинный эскейп (19A, 22F, 33F) и пенициллин-резистентность, которые фенотип не предсказывает"
    image: /assets/images/logo/icon_pneumoniae.svg

  - title: Стрептококк группы A (S. pyogenes)
    url: pyogenes
    desc: "emm-типирование вместо Сэнжера, суперантигены speA/speC/ssa и макролидная резистентность (ermB/mefA) — от ангины до некротического фасциита"
    image: /assets/images/logo/icon_pyogenes.svg

  - title: Стрептококк группы B (S. agalactiae)
    url: agalactiae
    desc: Скрининг беременных в родзале за часы вместо 18–48 ч культуры — серотипы, клон CC17 и маркеры резистентности при аллергии на пенициллин
    image: /assets/images/logo/icon_agalactiae.svg

  - title: Гонорея (N. gonorrhoeae)
    url: gonorrhoeae
    desc: Определение лекарственной устойчивости Neisseria gonorrhoeae — приоритетный патоген ВОЗ по АМР
    image: /assets/images/logo/icon_gonorrhoeae.svg

  - title: Менингококк (N. meningitidis)
    url: meningitidis
    desc: Серогруппирование и определение резистентности Neisseria meningitidis у постели пациента — молниеносный менингит, где каждый час критичен
    image: /assets/images/logo/icon_meningitidis.svg

  - title: Ванкомицин-резистентный энтерококк (E. faecium)
    url: faecium
    desc: "vanA/vanB с резолюцией плазмидного контекста Tn1546 на длинных прочтениях — трассировка вспышек ОРИТ и генотип вместо фенотипа для выбора терапии"
    image: /assets/images/logo/icon_faecium.svg

herpes_entries:
  - title: Цитомегаловирус (CMV)
    url: cmv
    desc: "Генотипирование резистентности в трансплантологии: UL97 (ганцикловир), UL54, UL56 (летермовир) — минорные субпопуляции 5–20%, которые Sanger не видит"
    image: /assets/images/logo/icon_cmv.svg

  - title: Простой герпес (HSV-1/HSV-2)
    url: hsv
    desc: "Энцефалит — каждый час = нейроны: mNGS ликвора и резистентность к ацикловиру (UL23/UL30) у иммуносупрессированных за часы"
    image: /assets/images/logo/icon_hsv.svg

  - title: Вирус Эпштейна–Барр (EBV)
    url: ebv
    desc: "«Кантонский рак» — скрининг рака носоглотки по ВЭБ-ДНК, штаммотипирование (del-LMP1) и клональность по терминальным репитам; PTLD"
    image: /assets/images/logo/icon_ebv.svg

  - title: HHV-6 и iciHHV-6
    url: hhv6
    desc: "Ловушка интеграции: ~1% людей несут HHV-6 в зародышевой линии — химерные риды «вирус–теломера» отличают её от реактивации и спасают от лишнего ганцикловира"
    image: /assets/images/logo/icon_hhv6.svg

farmer_entries:
  - title: Фитофтороз (Phytophthora infestans)
    url: phytophthora-infestans
    desc: Поздний ожог картофеля и томата — маркеры устойчивости к металаксилу, CAA-фунгицидам и стробилуринам
    image: /assets/images/logo/icon_phytophthora_infestans.svg

  - title: Корневая гниль сои (Phytophthora sojae)
    url: phytophthora-sojae
    desc: Корневая и стеблевая гниль сои — мониторинг рас и устойчивости к фениламидам и CAA
    image: /assets/images/logo/icon_phytophthora_sojae.svg

  - title: Фузариозное увядание (Fusarium oxysporum)
    url: fusarium-oxysporum
    desc: Увядание томата, огурца и зерновых — детекция специализированных форм (f. sp.) и бензимидазол-резистентности
    image: /assets/images/logo/icon_fusarium_oxysporum.svg

  - title: Фузариоз колоса (Fusarium graminearum)
    url: fusarium-graminearum
    desc: Фузариоз колоса пшеницы и ячменя — микотоксины ДОН/зеараленон, устойчивость к азолам и карбендазиму
    image: /assets/images/logo/icon_fusarium_graminearum.svg

  - title: Ранний ожог (Alternaria solani)
    url: alternaria-solani
    desc: Альтернариоз картофеля и томата — устойчивость к QoI (стробилуринам) и SDHI-фунгицидам
    image: /assets/images/logo/icon_alternaria_solani.svg

  - title: Серая гниль (Botrytis cinerea)
    url: botrytis-cinerea
    desc: Серая гниль винограда, земляники и овощей — полный профиль мультирезистентности к фунгицидам
    image: /assets/images/logo/icon_botrytis_cinerea.svg

  - title: Питиум (Pythium spp.)
    url: pythium
    desc: Корневые гнили и демпинг-офф рассады — отличие от Fusarium/Rhizoctonia, устойчивость к мефеноксаму
    image: /assets/images/logo/icon_pythium.svg

  - title: Милдью винограда (Plasmopara viticola)
    url: plasmopara-viticola
    desc: Ложная мучнистая роса винограда — устойчивость к QoI, CAA и фениламидам
    image: /assets/images/logo/icon_plasmopara_viticola.svg

  - title: Ложная мучнистая роса (Peronospora spp.)
    url: peronospora
    desc: Ложная мучнистая роса подсолнечника и лука — мониторинг рас и фениламид-резистентности
    image: /assets/images/logo/icon_peronospora.svg

  - title: Африканская чума свиней (АЧС, ASFV)
    url: asfv
    desc: Детекция ASFV у ворот фермы за часы — генотип по p72, низковирулентные делеционные варианты (CD2v/MGF), отличие от КЧС
    image: /assets/images/logo/icon_asfv.svg

  - title: Пирикуляриоз риса (Magnaporthe oryzae)
    url: magnaporthe
    desc: Самая разрушительная болезнь риса — мониторинг рас и Avr-эффекторов, патотип Triticum (wheat blast), чувствительность к фунгицидам
    image: /assets/images/logo/icon_magnaporthe.svg

  - title: Хуанлунбин цитрусовых (HLB)
    url: hlb
    desc: "«Зеленение» цитрусовых — некультивируемый Candidatus Liberibacter asiaticus, переносимый псиллидой: молекулярная детекция, SNP-кластеры и профиль профаг, дифференциация видов CLas/CLaf/CLam"
    image: /assets/images/logo/icon_hlb.svg

criminal_entries:
  - title: Портрет преступника по ДНК
    url: identikit
    desc: Предсказание внешности, происхождения и возраста по ДНК с места преступления — Forensic DNA Phenotyping на основе нанопорового секвенирования
    image: /assets/images/logo/icon_identikit.svg

