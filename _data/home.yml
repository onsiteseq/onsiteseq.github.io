  - title: Золотистой стафилококк (Staphylococcus aureus)
    url: staphylococcus
    desc: Определение резистентности
    image: /assets/images/logo/s.aureas.png

  - title: Классификация причины ОРВИ (поиск вирусных возбудителей)
    url: flu
    desc: Поиск вирусных возбудителей ОРВИ в метагеноме образца, взятого у кровати пациента.
    image: /assets/images/logo/orvi.png

  - title: Классификация причины ОРЗ (поиск бактериальных возбудителей).
    url: cold
    desc: Поиск бактериальных возбудителей ОРЗ в метагеноме образца, взятого у кровати пациента.
