<ul class="horizontal-list">
  {% for item in include.collection %}

    <li class="card">
      <a href="{{ item.url }}">
        <!-- Добавляем изображения для разных карточек -->
        {% if item.image %}
          <div class="card-image">
            <img class="{{ item.url }}-logo" src="{{ item.image }}" alt="{{ item.title }} логотип">
          </div>
        {% endif %}
        
        <span class="header">
          {{ item.title }}

          {% if item.highlight %}
            <mark>{{ item.highlight }}</mark>
          {% endif %}

        </span>

        <hr />

        {% if item.desc != false %}
        <p class="body">
          {{ item.desc }}
        </p>
        {% endif %}
      </a>
    </li>

  {% endfor %}
</ul>
